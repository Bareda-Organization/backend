# ─────────────────────────────────────────────────────────────────────────────
# 개발 환경 — **앱 오버레이** (backend + proxy + 관측 스택)
#
# 인프라 파일(`docker-compose.yml`)에 얹어 쓴다. 단독으로는 못 돈다 — postgres·redis 정의가
# 여기 없다(중복을 두면 두 파일이 갈린다).
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.app.yml ps
#   docker compose -f docker-compose.yml -f docker-compose.app.yml down
#
# ⚠ **`down` 에도 `-f` 두 개를 그대로 준다.** 빼고 `docker compose down` 만 하면 compose 가
#   인프라 파일만 읽어 backend·proxy·관측 컨테이너가 **살아남는다.** 매번 치기 번거로우면
#   셸에 한 줄 — `export COMPOSE_FILE=docker-compose.yml:docker-compose.app.yml`
#
# 접근 경로 — 모든 HTTP 는 proxy(:3000) 한 곳을 지난다. backend·web 은 호스트에 포트를 열지 않는다.
#   관계자 웹   http://localhost:3000
#   API        http://localhost:3000/api/v1/...
#   WebSocket  ws://localhost:3000/ws/location
#   Swagger    http://localhost:3000/swagger-ui/index.html
#   Grafana    http://localhost:3001  (admin / admin)
#   Prometheus http://localhost:9090
#   ⚠ 프록시가 **3000** 인 이유 — 네이버 지도 키의 서비스 URL 과 백엔드 CORS 허용 목록이
#     둘 다 `http://localhost:3000` 으로 등록돼 있다. 포트를 바꾸면 지도가 401 로 막힌다.
#   ⚠ `/actuator` 는 프록시가 라우팅하지 않는다 — 404 가 정상이다. 헬스를 보려면
#     `docker compose ... exec backend curl -s localhost:8080/actuator/health`
#
# 배포는 이 파일과 무관하다 — `docker-compose.prod.yml` 이 별도로 맡는다.
# ─────────────────────────────────────────────────────────────────────────────
services:
  backend:
    build: ./backend
    # 외부 API 키(NCP 네이버 Directions 등). git 에 없는 파일이라 required:false 로 둔다 —
    # 키 없이도 기동은 되고, 배차(auto-assign)만 401 로 실패한다.
    # ⚠️ 이게 없으면 도로 경로 호출이 실패해 배차 API 가 503(MAP_ROUTE_UNAVAILABLE)로만 보인다.
    #    대체 지도 공급자는 없다 — 공급자는 app.routing.map.provider(naver 기본 · stub 은 시험용)가 정한다.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # 컨테이너 내부에서는 서비스 이름(postgres/redis)으로 접속 (localhost 아님)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolbus
      SPRING_DATASOURCE_USERNAME: schoolbus
      SPRING_DATASOURCE_PASSWORD: schoolbus
      SPRING_DATA_REDIS_HOST: redis
      # ⚠ 포트도 함께 덮어야 한다 — application.yml 의 기본값이 16379 인데 그건 **호스트에 낸
      # 포트**다(다른 프로젝트가 6379 를 점유해 그렇게 뒀다). 컨테이너 네트워크 안에서 redis 는
      # 원래 포트 6379 로 듣는다. 호스트만 덮고 포트를 두면 `redis:16379` 로 붙어 연결이 거부되고,
      # **기동은 되지만 헬스가 DOWN 으로 남는다**(postgres 는 URL 에 포트가 박혀 있어 이 함정이 없다).
      # 2026-09-18 실제로 이것 때문에 컨테이너가 살아 있는 채로 계속 503 이었다.
      SPRING_DATA_REDIS_PORT: 6379
      # 시드 고르기 — 기본은 QA Mock(local). 웹·앱 실서버 계약 시험은 BACKEND_PROFILES=local,fixture 로 띄운다
      # (시험이 붙드는 계정·회차 id 가 시험 전용 시드 db/fixture 에 있다 — 2026-10-03 분리)
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILES:-local}
    # ⚠ Flyway clean() 을 끈다 — 이게 없으면 컨테이너가 기동 즉시 죽는다.
    # `local` 프로파일의 LocalFlywayCleanStrategy 는 "데이터소스가 localhost 를 가리킬 때만
    # clean() 한다"는 안전장치(겹③)를 갖는데, 컨테이너 안의 URL 은 `postgres:5432` 라
    # 그 판정에 걸려 IllegalStateException 으로 컨텍스트 기동이 실패한다.
    # 안전장치를 약화시키는 대신 그 클래스가 이미 가진 탈출구를 쓴다 — 이 값이 참이면
    # clean() 을 아예 호출하지 않고 migrate() 만 하므로, 안전장치가 지키려는 위험
    # (남의 DB 를 비우는 것)이 애초에 발생하지 않는다.
    # clean() 이 필요 없는 이유 — postgres 에 영속 볼륨이 없어 `down` 하면 DB 가 통째로
    # 사라지고 `up` 에서 빈 DB 로 새로 만들어진다. 즉 초기화는 compose 가 이미 한다.
    command: ["--app.flyway-clean.suppressed=true"]
    # 호스트에 포트를 열지 않는다 — 모든 접근은 proxy 를 거친다.
    # 컨테이너 네트워크 안에서는 `backend:8080` 으로 그대로 닿는다.
    expose:
      - "8080"
    # 컨테이너 헬스체크 — local 프로파일은 관리 포트를 따로 열지 않아 앱 포트(8080)의 /actuator/health 다(운영 계열은 8081 — docker-compose.prod.yml).
    # 이미지에 curl 이 있다(backend/Dockerfile). proxy 가 이 값을 기다려, backend 가 안 뜨면 `up` 단계에서 unhealthy 로 드러난다.
    # Flyway 와 QA 시드를 깔며 기동에 1분쯤 걸려 start_period 를 넉넉히 둔다. OpsSettingsGuardTest 가 포트·proxy 조건을 지킨다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 관계자 웹 (Next.js standalone). 운영은 Vercel 이고 이 이미지는 로컬 확인용이다.
  # ⚠ 빌드 컨텍스트가 형제 저장소 `../web` 다 — web 저장소를 이 저장소 옆에 clone 해 둬야 한다(README §2.2).
  web:
    build:
      context: ../web
      args:
        # 브라우저가 보는 주소다 — 컨테이너 이름(`backend`)이 아니라 프록시 진입점.
        # 브라우저는 호스트에서 돌기 때문이다. 빌드 시점에 번들에 박힌다(그 Dockerfile 참고).
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    # 호스트에 포트를 열지 않는다 — proxy 의 `/` 가 여기로 보낸다.
    expose:
      - "3000"
    depends_on:
      - backend

  # 엣지 리버스 프록시 — 브라우저가 닿는 유일한 진입점.
  # /api·/ws·/swagger-ui → backend, 나머지 `/` → web. 설정: infra/proxy/nginx.conf
  proxy:
    image: nginx:1.31.6-alpine
    ports:
      # ⚠ 3000 이다 — 80 이 아니다. 이유가 둘 있고 둘 다 외부 등록값에 묶여 있다.
      #  1) 네이버 지도 키의 "서비스 URL" 이 `http://localhost:3000` 으로 등록돼 있다
      #     (2026-09-13 발급). 다른 포트로 열면 SDK 인증이 401 로 거절되고 화면에는
      #     "지도를 불러오지 못했습니다" 만 뜬다 — 실제로 :80 으로 열었다가 겪었다.
      #  2) 백엔드 CORS 기본 허용 목록(`app.cors.allowed-origins`)도 3000 이 선두다.
      # 즉 `next dev` 로 개발하던 주소를 컨테이너 모드에서도 그대로 쓴다.
      - "3000:80"
    volumes:
      # 읽기 전용 마운트 — 설정만 바꿀 땐 이미지 재빌드 없이 `restart proxy` 면 된다.
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started

  # ── 관측 스택 ──────────────────────────────────────────────────────────────
  # 설계 근거: docs/archive/specs/2026-08-21-관제-대시보드-design.md
  # exporter 들은 호스트에 포트를 열지 않는다 — Prometheus 가 컨테이너 네트워크에서만 긁는다.
  # ⚠ prometheus 는 `backend:8080` 을 긁는다 — 즉 관측은 **앱을 컨테이너로 띄웠을 때만** 맞는다.
  #   IDE 에서 bootRun 하는 개발 방식에서는 `infra/observability/prometheus/prometheus.yml` 의
  #   주석 처리된 `host.docker.internal:8080` 쪽으로 바꿔야 한다.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬은 보존 7일이면 충분하다(운영은 15일). 디스크와 메모리를 아낀다.
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      # 대시보드는 Grafana 로 보지만, 지표 이름·라벨을 직접 확인할 때 필요하다.
      - "9090:9090"
    depends_on:
      - backend

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      # 평문 비밀번호 — 이 파일은 로컬 전용이라 구조적 위험은 낮다(운영은 docker-compose.prod.yml 이
      # ${DB_PASSWORD:?...} 로 환경변수 주입해 분리돼 있음). 관측 스택을 운영으로 옮길 때는
      # 이 줄을 그대로 복사하지 말고 docker-compose.prod.yml 의 환경변수 주입 방식을 따를 것.
      DATA_SOURCE_NAME: "postgresql://schoolbus:schoolbus@postgres:5432/schoolbus?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    expose:
      - "9121"
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter:v1.12.1
    # 호스트의 CPU·메모리·디스크를 읽기 위해 루트 파일시스템을 읽기 전용으로 마운트한다.
    # rslave 전파는 Docker Desktop(macOS)의 VM 루트가 shared/slave 마운트가 아니라서
    # "path / is mounted on / but it is not a shared or slave mount" 로 기동이 실패한다 —
    # 로컬은 실제 리눅스 호스트가 아니라 VM 안이므로 전파 옵션 없이 ro 마운트만으로 충분하다.
    #
    # ⚠ macOS 로컬에서 node-exporter 가 보는 "호스트"는 맥 자체가 아니라
    #   Docker Desktop 이 띄우는 리눅스 VM 이다 — 여기서 나오는 디스크·load average 수치는
    #   맥의 실제 값이 아니라 그 VM의 값이다(컨테이너들이 실제로 도는 곳이라 관측할 가치는 있다).
    #   운영(리눅스 EC2, docker-compose.prod.yml)에서는 이 rootfs 마운트가 정상 동작해
    #   실제 호스트를 그대로 본다.
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    expose:
      - "9100"

  # 대시보드는 이 서비스에서 본다. datasource·대시보드 폴더는 파일로 프로비저닝한다 —
  # UI에서 손으로 등록하면 컨테이너를 다시 만들 때(down 후 up) 사라지고 재현이 안 된다.
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # ⚠️ 로컬 전용 값이다. 운영 노출(2단계) 시 반드시 바꾼다 — 기본 계정을 유지한 채
      #    서브도메인을 열면 그 시점에 관리 콘솔이 그대로 공개된다.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # 익명 열람 비활성. 로컬이라도 습관을 운영과 다르게 들이지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 외부 플러그인·뉴스 패널 등 바깥으로 나가는 호출을 끈다.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # ⚠ 호스트 3001 로 비켜 준다 — 3000 은 프록시(관계자 웹)가 쓴다. 위 proxy 주석 참고.
      - "3001:3000"
    depends_on:
      - prometheus
