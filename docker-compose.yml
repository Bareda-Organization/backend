# ─────────────────────────────────────────────────────────────────────────────
# 개발 환경 — **인프라만** (postgres + redis)
#
#   docker compose up -d                # 이 파일만. 백엔드는 IDE 에서 ./gradlew bootRun
#   docker compose down                 # 컨테이너 제거 = DB 초기화(영속 볼륨 부재)
#
# 백엔드까지 컨테이너로 띄우려면 앱 오버레이를 함께 준다 — `docker-compose.app.yml` 머리말 참고.
# 배포는 `docker-compose.prod.yml` 이 별도로 맡는다(ECR 이미지 · 영속 볼륨 · TLS).
#
# ⚠ 이 파일에 backend·proxy·관측 스택을 다시 넣지 마라. 2026-09-18 에 그 셋이 여기 섞여 있어
#   "인프라만 띄우고 IDE 에서 bootRun" 하는 개발 방식과 "전부 컨테이너" 가 구분되지 않았다.
#   DB·Redis 포트를 호스트에 내는 것이 이 파일의 존재 이유다 — bootRun 이 붙을 자리다.
# ─────────────────────────────────────────────────────────────────────────────
# 프로젝트 이름을 고정한다 — 빼면 폴더 이름이 쓰여 컨테이너 이름(`school-bus-postgres-1`)이 바뀌고,
# 그 이름을 박아 둔 부하 측정 스크립트(backend/load/)가 깨진다. 저장소 분리(2026-10-02)로 폴더가 `backend` 가 됐다.
name: school-bus

services:
  postgres:
    image: postgres:18.6
    # 접속 상한을 기본 100 에서 300 으로 올린다 (2026-09-17, R7).
    # @SpringBootTest 컨텍스트는 한 번 뜨면 JVM 이 끝날 때까지 캐시에 남고 각자 Hikari 풀을
    # 붙든 채로 있다 — 한 JVM 이 수십 개를 쥔다. 병렬 작업으로 테스트 JVM 이 둘셋 + bootRun
    # 서버가 뜨면 100 을 넘겨 "sorry, too many clients already"(SQLSTATE 53300)가 나는데,
    # 그 실패가 `Failed to load ApplicationContext` 형태라 코드 결함과 구별되지 않는다.
    # backend/build.gradle 이 테스트 풀 상한을 6 으로 낮춘 것과 같은 결함을 반대쪽에서 막는다
    # (저쪽은 한 JVM 이 쥐는 양을 줄이고, 이쪽은 전체 상한을 늘린다).
    # 300 인 근거 — postgres 는 접속당 약 2MB 를 쓰므로 300 이면 최대 600MB 이고,
    # 개발 노트북에서 감당 가능하다. 그 이상은 연결 풀러(pgbouncer)를 두는 편이 맞다.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
    ports:
      # 호스트 15432 로 낸다 — 개발 노트북에 다른 프로젝트의 postgres 가 5432 를 쓰고 있어
      # 기본 포트로 두면 테스트가 남의 DB 에 붙어 인증 실패 수백 건으로 나타난다(2026-09-06 실측).
      - "15432:5432"
    # 의도적으로 영속 볼륨을 두지 않는다 — Swagger로 반복 테스트하는 동안 쌓이는 변경사항을
    # "docker compose down" 이후엔 항상 시드(V1+V2) 상태로 되돌리기 위함. stop/start(컨테이너
    # 유지)는 데이터가 남고, down 후 up(컨테이너 재생성)에서만 초기화된다.
    # ⚠ 배포는 반대다 — docker-compose.prod.yml 은 `postgres-data` 볼륨을 둔다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.10.2
    ports:
      # postgres 와 같은 이유로 16379 (다른 프로젝트가 6379 점유).
      # ⚠ 이 16379 는 **호스트에 내는 포트**다. 컨테이너 안에서 redis 는 6379 로 듣는다 —
      #   앱을 컨테이너로 띄울 때 이 값을 그대로 쓰면 연결이 거부된다(`docker-compose.app.yml` 참고).
      - "16379:6379"
