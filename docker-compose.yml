# 기본 실행 대상: postgres + redis + kafka + backend(Spring) — frontend는 profile로 분리해 기본에서 제외.
# 실행:  docker compose up -d --build
#   - 백엔드:  http://localhost:8080
# 기존 프론트(Next.js)까지 같이 띄우려면:  docker compose --profile frontend up -d --build
#   - 프론트:  http://localhost:3000
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
    ports:
      - "5432:5432"
    # 의도적으로 영속 볼륨을 두지 않는다 — Swagger로 반복 테스트하는 동안 쌓이는 변경사항을
    # "docker compose down" 이후엔 항상 시드(V1+V2) 상태로 되돌리기 위함. stop/start(컨테이너
    # 유지)는 데이터가 남고, down 후 up(컨테이너 재생성)에서만 초기화된다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # KRaft 모드(Kafka 자체가 컨트롤러 역할 겸임) — Zookeeper 컨테이너 불필요.
  # PLAINTEXT(9092) = 컨테이너 간 통신, PLAINTEXT_HOST(29092) = 호스트에서 bootRun 으로 직접 붙을 때
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"

  backend:
    build: ./backend
    environment:
      # 컨테이너 내부에서는 서비스 이름(postgres/redis/kafka)으로 접속 (localhost 아님)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolbus
      SPRING_DATASOURCE_USERNAME: schoolbus
      SPRING_DATASOURCE_PASSWORD: schoolbus
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  frontend:
    profiles: ["frontend"]   # 기본 `docker compose up`에서는 제외 — 새 프론트엔드로 작업 중일 때 불필요한 빌드/기동 방지
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
