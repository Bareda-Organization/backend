# 기본 실행 대상: postgres + redis + kafka + backend(Spring) + frontend(Flutter Web) + proxy(nginx).
# 실행:  docker compose up -d --build
#
# ★ 모든 HTTP 접근은 proxy(:80) 한 곳을 지난다. backend·frontend는 호스트에 포트를 열지 않는다.
#   - 화면:      http://localhost/
#   - API:       http://localhost/api/...
#   - WebSocket: ws://localhost/ws/location
#   - Swagger:   http://localhost/swagger-ui/index.html
#   프론트와 API가 같은 출처가 되므로 브라우저 CORS 자체가 발생하지 않는다.
#
# DB/Redis/Kafka 포트만 호스트에 남겨둔다 — DB 툴 접속과, 인프라만 컨테이너로 띄우고
# 백엔드는 IDE에서 `./gradlew bootRun` 으로 돌리는 개발 방식을 위해서다.
#
# 프론트 UI를 반복 수정할 땐 컨테이너 재빌드가 느리니 로컬 실행이 낫다:
#   cd frontend && flutter run -d chrome --dart-define=API_BASE_URL=http://localhost:8080
#   (이땐 프록시를 안 거치므로 백엔드를 8080으로 따로 띄우고 CORS 허용 목록을 쓴다)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
    ports:
      - "5432:5432"
    # 의도적으로 영속 볼륨을 두지 않는다 — Swagger로 반복 테스트하는 동안 쌓이는 변경사항을
    # "docker compose down" 이후엔 항상 시드(V1+V2) 상태로 되돌리기 위함. stop/start(컨테이너
    # 유지)는 데이터가 남고, down 후 up(컨테이너 재생성)에서만 초기화된다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # KRaft 모드(Kafka 자체가 컨트롤러 역할 겸임) — Zookeeper 컨테이너 불필요.
  # PLAINTEXT(9092) = 컨테이너 간 통신, PLAINTEXT_HOST(29092) = 호스트에서 bootRun 으로 직접 붙을 때
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"

  backend:
    build: ./backend
    environment:
      # 컨테이너 내부에서는 서비스 이름(postgres/redis/kafka)으로 접속 (localhost 아님)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolbus
      SPRING_DATASOURCE_USERNAME: schoolbus
      SPRING_DATASOURCE_PASSWORD: schoolbus
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # 호스트에 포트를 열지 않는다 — 모든 접근은 proxy(:80)를 거친다.
    # 컨테이너 네트워크 안에서는 `backend:8080` 으로 그대로 닿는다.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  # Flutter Web 빌드 → nginx 정적 서빙. 컨테이너 안에서 실행되는 건 Web 타깃뿐이다
  # (모바일 앱은 컨테이너에서 "실행"할 수 없다 — frontend/docs/FLUTTER_FRONTEND_PLAN.md §1.2).
  frontend:
    build:
      context: ./frontend
      args:
        # 프록시를 거치면 프론트와 API 가 같은 출처(:80)라 호스트/포트를 붙일 필요가 없다.
        # 빈 값이면 dio 가 상대 경로(/api/...)로 요청하고, 브라우저가 현재 출처를 붙인다.
        # → 주소가 localhost 든 배포 도메인이든 같은 번들이 그대로 동작하고, CORS 도 사라진다.
        API_BASE_URL: ""
    expose:
      - "80"
    depends_on:
      - backend

  # 엣지 리버스 프록시 — 브라우저가 닿는 유일한 진입점.
  # / → frontend, /api·/ws·/swagger-ui → backend. 설정: infra/proxy/nginx.conf
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # 읽기 전용 마운트 — 설정만 바꿀 땐 이미지 재빌드 없이 `docker compose restart proxy` 면 된다.
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
