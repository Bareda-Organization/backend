# 기본 실행 대상: postgres + redis + kafka + backend(Spring) + frontend(Flutter Web).
# 실행:  docker compose up -d --build
#   - 프론트:  http://localhost:3000   (Flutter Web 빌드를 nginx가 정적 서빙)
#   - 백엔드:  http://localhost:8080
#
# 프론트 UI를 반복 수정할 땐 컨테이너 재빌드가 느리니 로컬 실행이 낫다:
#   cd frontend && flutter run -d chrome --web-port=3000
# 어느 쪽이든 origin이 localhost:3000이라 백엔드 CORS 설정은 그대로 통과한다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
    ports:
      - "5432:5432"
    # 의도적으로 영속 볼륨을 두지 않는다 — Swagger로 반복 테스트하는 동안 쌓이는 변경사항을
    # "docker compose down" 이후엔 항상 시드(V1+V2) 상태로 되돌리기 위함. stop/start(컨테이너
    # 유지)는 데이터가 남고, down 후 up(컨테이너 재생성)에서만 초기화된다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # KRaft 모드(Kafka 자체가 컨트롤러 역할 겸임) — Zookeeper 컨테이너 불필요.
  # PLAINTEXT(9092) = 컨테이너 간 통신, PLAINTEXT_HOST(29092) = 호스트에서 bootRun 으로 직접 붙을 때
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"

  backend:
    build: ./backend
    environment:
      # 컨테이너 내부에서는 서비스 이름(postgres/redis/kafka)으로 접속 (localhost 아님)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolbus
      SPRING_DATASOURCE_USERNAME: schoolbus
      SPRING_DATASOURCE_PASSWORD: schoolbus
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  # Flutter Web 빌드 → nginx 정적 서빙. 컨테이너 안에서 실행되는 건 Web 타깃뿐이다
  # (모바일 앱은 컨테이너에서 "실행"할 수 없다 — frontend/docs/FLUTTER_FRONTEND_PLAN.md §1.2).
  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저가 보는 주소다. 컨테이너명(backend:8080)이 아니라 localhost:8080 —
        # 요청 주체가 컨테이너가 아니라 사용자 브라우저이기 때문.
        API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"   # nginx는 컨테이너 내부 80. 호스트 3000은 백엔드 CORS 허용 목록에 이미 있다
    depends_on:
      - backend
