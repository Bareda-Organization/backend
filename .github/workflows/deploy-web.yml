# Flutter Web 배포: 빌드 → Vercel prebuilt 업로드.
#
# Vercel 에는 Flutter 빌더가 없다(Git 연동만으로는 빌드 불가). 그래서 여기서 빌드하고
# 완성된 산출물을 .vercel/output 규격으로 감싸 올린다.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: 웹 빌드
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # API_BASE_URL 이 https 면 api_config.dart 가 WebSocket 을 wss 로 알아서 유도한다.
          # ENABLE_QUICK_LOGIN 은 반드시 false — 켜면 시드 계정 목록이 로그인 화면에 노출된다.
          flutter build web --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENABLE_QUICK_LOGIN=false

      - name: Vercel prebuilt 구조로 포장
        run: |
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          cp vercel.output.config.json .vercel/output/config.json

      - name: Vercel 배포
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
