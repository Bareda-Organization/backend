# PR·main 검증: 백엔드 시험. 배포(deploy-backend.yml)와 별개다 — 이 워크플로는 아무것도 배포하지 않는다.
# 관계자 웹·앱 검사는 각자의 저장소(web · mobile)에 있다 — 2026-10-02 저장소 분리.
#
# 공개 저장소라 Actions 로그도 공개다. 그래서
#   - 비밀값이 필요 없게 돈다(네이버 키 없이 — build.gradle 이 지오코딩·경로·장소검색을 stub 으로 고정한다)
#   - 애플리케이션 로그를 찍지 않는다: -PciQuiet 으로 로그 수준을 WARN 으로 낮추고 결과 XML 에서 stdout/stderr 를 뺀다.
#     실패 시 남는 것은 시험 이름 · 실패 요약뿐이다
#   - 실 네이버 API 를 부르는 @Tag("live") 시험은 여기서 돌지 않는다(자격증명 없음 · 일일 한도)
name: ci

# 백엔드 코드·이 파일이 바뀔 때만 돈다 — 문서만 바뀐 커밋에 40분짜리 시험을 돌리지 않는다.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/ci.yml']
  # 손으로 돌리는 버튼 — 경로 필터는 새 브랜치의 첫 push 를 건너뛸 수 있다(2026-10-02 조직 저장소 첫 push 에서 실제로 안 돌았다).
  workflow_dispatch:

# 같은 PR 에 새 커밋이 오면 앞선 실행을 취소한다. main push 는 취소하지 않는다(모든 커밋의 결과가 남는다).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # 서비스 컨테이너 대신 저장소 compose 를 쓴다 — postgres 접속 상한(max_connections=300)이 compose 의 command 에 있고,
      # 서비스 컨테이너는 그 인자를 줄 수 없다(기본 100 이면 컨텍스트 캐시가 쌓이는 전체 실행에서 "too many clients").
      # Redis 는 시험이 Testcontainers 로 자동으로 붙인다(러너에 Docker 가 있다).
      - name: postgres 기동 · 전용 DB 생성
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U schoolbus -d postgres -c 'CREATE DATABASE schoolbus_ci'

      - name: 백엔드 시험(실 API 시험 제외)
        working-directory: backend
        run: ./gradlew test -PtestDbUrl=jdbc:postgresql://localhost:15432/schoolbus_ci -PciQuiet --console=plain

      - name: 결과 XML 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/build/test-results/test/*.xml
          retention-days: 7

