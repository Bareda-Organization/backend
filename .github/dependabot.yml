# 의존성·이미지·액션 버전 갱신 — 주 1회, 생태계별로 한 묶음(PR 이 쏟아지지 않게).
# 공개 저장소라 취약 의존성 경보(Dependabot alerts)는 저장소 설정에서 따로 켠다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # 런타임 이미지는 LTS 만(Ruling 727) — temurin 은 Java 툴체인 25 에 맞춘다. 주 버전은 LTS 주기에 맞춰 사람이 따로 올린다
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
    # postgres 18 부터 데이터가 /var/lib/postgresql/<주 버전>/docker 에 놓인다 — 주 버전만 올리면 기존 볼륨을 못 읽고 빈 DB 로 뜬다(RuntimeImageParityTest).
    # 주 버전 상향은 docs/backend/infra/DEPLOYMENT.md §7.4 절차로 사람이 한다. 같은 주 버전 안의 갱신(18.6 → 18.7)은 계속 받는다
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
