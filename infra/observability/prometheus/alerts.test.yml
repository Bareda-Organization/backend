# alerts.yml 규칙 단위 시험 — promtool 이 가짜 시계열로 발화 여부를 본다(운영 서버 없이 조건식·for 를 검증한다).
#   docker run --rm -v "$PWD/infra/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.15.0 test rules /p/alerts.test.yml
rule_files:
  - alerts.yml
evaluation_interval: 15s

tests:
  # 미승차 에스컬레이션 실패(BR-329): 스케줄러 실행이 예외로 끝났거나(기본 계측 outcome=ERROR) 건별 실패 카운터가 3분 창 안에서 늘었을 때만 발화하고
  # for 가 없다 — 즉시 critical. 다른 스케줄러(retention-cleanup)의 실패는 이 경보가 아니다. 증가가 멈춘 채 창(3분)을 지나면 꺼진다.
  - interval: 30s
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="escalateDueNoShowCases",code_namespace="src.backend.exception.scheduler.NoShowEscalationScheduler",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '0x10 1x40'
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="cleanUp",code_namespace="src.backend.global.retention.RetentionCleanupScheduler",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '0x10 5x40'
      - series: 'schoolbus_scheduler_failures_total{job="backend",application="school-bus",scheduler="no-show-escalation"}'
        values: '0x30 1x20'
    alert_rule_test:
      - eval_time: 4m   # 아직 한 번도 안 늘었다
        alertname: NoShowEscalationFailing
        exp_alerts: []
      - eval_time: 6m   # 5분 무렵에 실행 실패 0 → 1 — 3분 창 안
        alertname: NoShowEscalationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.exception.scheduler.NoShowEscalationScheduler
            exp_annotations:
              summary: 미승차 에스컬레이션 처리가 실패하고 있다 — 3분 안에 보고되지 않는 미승차가 생긴다
      - eval_time: 12m   # 실행 실패 증가가 멈춘 지 창(3분)을 넘었다
        alertname: NoShowEscalationFailing
        exp_alerts: []
      - eval_time: 15m30s   # 15분 무렵에 건별 실패 카운터 0 → 1 — 3분 창 안
        alertname: NoShowEscalationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              scheduler: no-show-escalation
            exp_annotations:
              summary: 미승차 에스컬레이션 처리가 실패하고 있다 — 3분 안에 보고되지 않는 미승차가 생긴다

  # 미승차 에스컬레이션 정지(BR-329): 성공 실행이 3분 창에 한 번도 없거나 시리즈가 사라진 채 for(1분)를 채우면 발화한다.
  - interval: 30s
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="escalateDueNoShowCases",code_namespace="src.backend.exception.scheduler.NoShowEscalationScheduler",error="none",exception="none",outcome="SUCCESS"}'
        values: '0+1x10 10x30'   # 5분 무렵까지 30초마다 성공하다 멈춘다
    alert_rule_test:
      - eval_time: 7m   # 멈춘 지 2분 — 3분 창에 아직 증가가 남아 있다
        alertname: NoShowEscalationStalled
        exp_alerts: []
      - eval_time: 9m30s   # 창에 증가가 없어진 지 1분이 지났다
        alertname: NoShowEscalationStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.exception.scheduler.NoShowEscalationScheduler
            exp_annotations:
              summary: 미승차 에스컬레이션 스케줄러가 3분 넘게 성공하지 않았다

  - interval: 30s   # 시리즈가 아예 없다(스케줄러가 한 번도 성공하지 못했거나 사라졌다) — absent 가 for(1분) 뒤에 발화한다
    input_series:
      - series: 'up{job="backend"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 30s   # for 가 안 찼다
        alertname: NoShowEscalationStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: NoShowEscalationStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.exception.scheduler.NoShowEscalationScheduler
              outcome: SUCCESS
            exp_annotations:
              summary: 미승차 에스컬레이션 스케줄러가 3분 넘게 성공하지 않았다

  # 일일 회차 생성 실패(BR-333): 기본 계측 outcome=ERROR 실행 수가 1시간 창 안에서 늘면 발화하고 for 가 없다 — 즉시 critical.
  # 다른 스케줄러의 실패 · 다른 job(부하 시험)의 같은 클래스는 이 경보가 아니다.
  - interval: 1m
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="generateTodayAndTomorrow",code_namespace="src.backend.schedule.scheduler.DailyRunGenerator",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '0x10 1x200'
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="cleanUp",code_namespace="src.backend.global.retention.RetentionCleanupScheduler",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '0x10 9x200'
      - series: 'tasks_scheduled_execution_seconds_count{job="school-bus-load",application="school-bus",code_function="generateTodayAndTomorrow",code_namespace="src.backend.schedule.scheduler.DailyRunGenerator",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '0x10 9x200'
    alert_rule_test:
      - eval_time: 5m   # 아직 한 번도 안 늘었다
        alertname: DailyRunGenerationFailing
        exp_alerts: []
      - eval_time: 15m   # 10분 무렵에 0 → 1 — 1시간 창 안
        alertname: DailyRunGenerationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.schedule.scheduler.DailyRunGenerator
            exp_annotations:
              summary: 일일 회차 생성(DailyRunGenerator)이 실패했다 — 그날 회차가 만들어지지 않아 기사·학부모 알림이 나가지 않는다
      - eval_time: 90m   # 증가가 멈춘 지 창(1시간)을 넘었다 — 이 뒤는 아래 정지 경보가 이어서 본다
        alertname: DailyRunGenerationFailing
        exp_alerts: []

  # 푸시 실패: 누적 카운터가 늘어난 구간에서만 발화하고, 10분 창을 지나 증가가 멈추면 꺼진다.
  - interval: 15s
    input_series:
      - series: 'schoolbus_notification_push_failures_total{application="school-bus"}'
        values: '0x20 3x100'
      - series: 'schoolbus_notification_push_failures_total{application="quiet"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 4m
        alertname: PushDeliveryFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: PushDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              application: school-bus
            exp_annotations:
              summary: 재시도를 소진해 실패로 굳은 푸시 알림이 최근 10분 안에 있다
      - eval_time: 20m   # 증가가 5분 무렵에 멈춘 지 10분 넘음 — 창에서 빠져 꺼진다
        alertname: PushDeliveryFailing
        exp_alerts: []

  # 방송 중계 발행 실패(Ruling 900 B): 첫 실패 때 카운터가 1 로 태어나도(increase 는 0) 발화하고, 이미 있던 카운터가 늘어도 발화한다. 멈추고 창(3분)이 지나면 꺼지며,
  # 한 번도 실패하지 않은 인스턴스(0 유지)는 발화하지 않는다.
  - interval: 30s
    input_series:
      - series: 'schoolbus_ws_relay_publish_failed_total{job="backend",instance="a",event="position"}'
        values: '_x10 1x40'
      - series: 'schoolbus_ws_relay_publish_failed_total{job="backend",instance="b",event="position"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 4m   # 아직 아무 실패도 없다
        alertname: WebSocketRelayPublishFailing
        exp_alerts: []
      - eval_time: 6m   # 첫 실패로 시리즈가 1 에서 태어났다 — increase() 는 0 이지만 새 시리즈라 발화한다
        alertname: WebSocketRelayPublishFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backend
            exp_annotations:
              summary: 방송 중계(Redis) 발행이 실패하고 있다 — 다른 인스턴스에 붙은 구독자는 그동안의 방송을 받지 못한다
      - eval_time: 12m   # 첫 실패 뒤 3분 창을 지나 시리즈가 더 늘지 않았다 — 꺼진다
        alertname: WebSocketRelayPublishFailing
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'schoolbus_ws_relay_publish_failed_total{job="backend",instance="a",event="position"}'
        values: '0x10 1x5 3x40'
    alert_rule_test:
      - eval_time: 5m30s   # 있던 카운터가 0 에서 1 로 늘었다
        alertname: WebSocketRelayPublishFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backend
            exp_annotations:
              summary: 방송 중계(Redis) 발행이 실패하고 있다 — 다른 인스턴스에 붙은 구독자는 그동안의 방송을 받지 못한다

  # 디스크: 루트(`/`)와 데이터 디스크(`/var/lib/docker/volumes` — DB·사진·지표·인증서, bootstrap-ec2.sh 0단계가 마운트)가 각각
  # 80% 를 넘어 10분 유지돼야 발화한다. 이름이 비슷한 다른 마운트 지점(`/var/lib/docker`)은 보지 않는다 — 식이 정확히 일치할 때만 본다.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/",instance="h"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{mountpoint="/",instance="h"}'
        values: '15x30'
      - series: 'node_filesystem_size_bytes{mountpoint="/var/lib/docker/volumes",instance="h"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{mountpoint="/var/lib/docker/volumes",instance="h"}'
        values: '10x30'
      - series: 'node_filesystem_size_bytes{mountpoint="/var/lib/docker",instance="h"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{mountpoint="/var/lib/docker",instance="h"}'
        values: '5x30'
    alert_rule_test:
      - eval_time: 5m   # 둘 다 80% 를 넘었지만 아직 10분이 안 됐다
        alertname: HostDiskAlmostFull
        exp_alerts: []
      - eval_time: 12m   # 루트 85% · 데이터 디스크 90% 가 각각 발화한다. /var/lib/docker(95%)는 보지 않는다
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: warning
              mountpoint: /
              instance: h
            exp_annotations:
              summary: 호스트 디스크 / 의 사용률이 80% 를 넘은 지 10분 됐다
          - exp_labels:
              severity: warning
              mountpoint: /var/lib/docker/volumes
              instance: h
            exp_annotations:
              summary: 호스트 디스크 /var/lib/docker/volumes 의 사용률이 80% 를 넘은 지 10분 됐다

  # 루트는 멀쩡한데 데이터 디스크만 찬 경우(BR-305) — DB 쓰기가 실패해 전면 정지하는 바로 그 상황이다. 데이터 디스크 하나만 발화한다.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/",instance="h"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{mountpoint="/",instance="h"}'
        values: '70x30'
      - series: 'node_filesystem_size_bytes{mountpoint="/var/lib/docker/volumes",instance="h"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{mountpoint="/var/lib/docker/volumes",instance="h"}'
        values: '8x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: warning
              mountpoint: /var/lib/docker/volumes
              instance: h
            exp_annotations:
              summary: 호스트 디스크 /var/lib/docker/volumes 의 사용률이 80% 를 넘은 지 10분 됐다

  # DB 백업(매시): 마지막 성공 시각(시험에서는 0 = 시계 원점)에서 2시간(7200초)이 지난 뒤 5분 유지돼야 발화한다.
  # 매시 백업이 한 번 빠지는 것(1시간+)은 조용하고 두 번 연속 빠지면 울린다 — 그래야 RPO 1시간이 깨지기 전에 안다.
  - interval: 1m
    input_series:
      - series: 'schoolbus_backup_db_last_success_timestamp_seconds{instance="stale"}'
        values: '0x200'
      - series: 'schoolbus_backup_db_last_success_timestamp_seconds{instance="healthy"}'
        values: '0+60x200'   # 값이 시계와 같이 올라간다 — 방금 성공한 것
    alert_rule_test:
      - eval_time: 119m   # 한 번 빠진 정도(경과 7140초)
        alertname: BackupDbStale
        exp_alerts: []
      - eval_time: 123m   # 7200초를 넘었지만 for(5m)가 안 찼다
        alertname: BackupDbStale
        exp_alerts: []
      - eval_time: 130m
        alertname: BackupDbStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: stale
            exp_annotations:
              summary: DB 백업이 2시간 넘게 성공하지 않았다 — 목표 유실 1시간(RPO)이 깨지고 있다

  # 지표가 아예 없으면(certbot 컨테이너가 안 돈다 · 지표 폴더가 안 맞는다) 같은 경보다.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="h"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: CertbotRenewStale
        exp_alerts: []
      - eval_time: 10m
        alertname: CertbotRenewStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 인증서 갱신(certbot)이 2일 넘게 성공하지 않았다 — 만료 전에 고치지 않으면 모든 클라이언트의 HTTPS 연결이 한꺼번에 거절된다

  # 지표가 아예 없는 경우(크론이 안 돈다 · 한 번도 성공하지 못했다)도 같은 경보다.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="h"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: BackupDbStale
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupDbStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: DB 백업이 2시간 넘게 성공하지 않았다 — 목표 유실 1시간(RPO)이 깨지고 있다

  # ── 백엔드 가용성 5종 ─────────────────────────────────────────────────────────────

  # 백엔드 다운: up=0 이 1분 유지돼야 발화한다. 한 번의 스크레이프 실패(15초)는 조용하다.
  - interval: 15s
    input_series:
      - series: 'up{job="backend",instance="backend:8080"}'
        values: '1x8 0x40'
    alert_rule_test:
      - eval_time: 1m45s   # 아직 up=1
        alertname: BackendDown
        exp_alerts: []
      - eval_time: 2m30s   # up=0 이 된 지 30초 — pending
        alertname: BackendDown
        exp_alerts: []
      - eval_time: 4m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              instance: backend:8080
            exp_annotations:
              summary: 백엔드가 1분 넘게 응답하지 않는다 — 이 동안 백엔드 지표에 기대는 다른 경보(미확정 회차·위치 유실·푸시 실패)는 값이 없어 울리지 않는다

  - interval: 15s
    input_series:
      - series: 'up{job="backend",instance="backend:8080"}'
        values: '1x10 0x2 1x40'   # 스크레이프 2번(30초) 실패 — 1분이 안 찬다
    alert_rule_test:
      - eval_time: 5m
        alertname: BackendDown
        exp_alerts: []

  # 대상이 스크레이프 목록에서 아예 사라진 경우(up 시계열이 없다)도 같은 경보다 — `up == 0` 은 시계열이 없으면 아무것도 못 본다.
  - interval: 15s
    input_series:
      - series: 'up{job="node",instance="h"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30s
        alertname: BackendDown
        exp_alerts: []
      - eval_time: 4m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
            exp_annotations:
              summary: 백엔드가 1분 넘게 응답하지 않는다 — 이 동안 백엔드 지표에 기대는 다른 경보(미확정 회차·위치 유실·푸시 실패)는 값이 없어 울리지 않는다

  # 5xx 비율: 최근 5분 창에서 5% 초과가 2분 유지돼야 발화한다(actuator·/healthz 제외 · 분당 6건 이상일 때만).
  - interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",application="school-bus",uri="/runs/{runId}/position",status="200"}'
        values: '0+60x80'
      - series: 'http_server_requests_seconds_count{job="backend",application="school-bus",uri="/runs/{runId}/position",status="500"}'
        values: '0+10x80'   # 10 / 70 = 14%
      - series: 'http_server_requests_seconds_count{job="backend",application="school-bus",uri="/actuator/prometheus",status="200"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 1m
        alertname: Http5xxRatioHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: Http5xxRatioHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 최근 5분 요청의 5% 넘게 5xx 로 응답했다(actuator·/healthz 제외 · 분당 6건 이상일 때만 판정)

  - interval: 15s   # 1% — 임계 아래
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",uri="/runs/{runId}/position",status="200"}'
        values: '0+99x80'
      - series: 'http_server_requests_seconds_count{job="backend",uri="/runs/{runId}/position",status="500"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: Http5xxRatioHigh
        exp_alerts: []

  - interval: 15s   # 비율은 50% 지만 요청이 분당 2건 남짓(0.04 req/s) — 한두 건으로 울리지 않는다
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",uri="/runs/{runId}/position",status="200"}'
        values: '0+0.3x80'
      - series: 'http_server_requests_seconds_count{job="backend",uri="/runs/{runId}/position",status="500"}'
        values: '0+0.3x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: Http5xxRatioHigh
        exp_alerts: []

  - interval: 15s   # actuator · /healthz(외부 감시용 헬스 — Ruling 740)가 503(Redis 장애로 헬스 DOWN)이어도 · 부하 시험 프로파일(job 이 다르다)이 5xx 여도 울리지 않는다
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",uri="/runs/{runId}/position",status="200"}'
        values: '0+60x80'
      - series: 'http_server_requests_seconds_count{job="backend",uri="/actuator/health",status="503"}'
        values: '0+30x80'
      - series: 'http_server_requests_seconds_count{job="backend",uri="/healthz",status="503"}'
        values: '0+30x80'
      - series: 'http_server_requests_seconds_count{job="school-bus-load",uri="/runs/{runId}/position",status="500"}'
        values: '0+60x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: Http5xxRatioHigh
        exp_alerts: []
  # 스케줄러 정지: 확정·아웃박스는 2분 창, 근접 판정은 1분 창에 성공 실행이 없으면 for(1분)를 채운 뒤 발화한다. 값이 계속 늘면 도는 것이다.
  - interval: 15s
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="judgeMovingRuns",code_namespace="src.backend.location.scheduler.ProximityNotificationScheduler",error="none",exception="none",outcome="SUCCESS"}'
        values: '0+1x8 8x70'   # 2분 무렵 멈춘다
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="confirmDueRuns",code_namespace="src.backend.run.scheduler.RunConfirmationScheduler",error="none",exception="none",outcome="SUCCESS"}'
        values: '0+1x80'   # 계속 돈다
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="sweep",code_namespace="src.backend.notification.scheduler.NotificationOutboxWorker",error="none",exception="none",outcome="SUCCESS"}'
        values: '0+1x20 20x60'   # 5분 무렵 멈춘다
    alert_rule_test:
      - eval_time: 3m   # 근접이 멈춘 지 1분 — 창에 아직 증가가 남아 for 가 안 찼다
        alertname: SchedulerStalled
        exp_alerts: []
      - eval_time: 4m30s   # 근접만 발화
        alertname: SchedulerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.location.scheduler.ProximityNotificationScheduler
            exp_annotations:
              summary: 스케줄러(src.backend.location.scheduler.ProximityNotificationScheduler)가 주기의 3배 넘게 성공하지 않았다
      - eval_time: 9m   # 아웃박스도 발화 · 확정(계속 돈다)은 끝까지 조용
        alertname: SchedulerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.location.scheduler.ProximityNotificationScheduler
            exp_annotations:
              summary: 스케줄러(src.backend.location.scheduler.ProximityNotificationScheduler)가 주기의 3배 넘게 성공하지 않았다
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.notification.scheduler.NotificationOutboxWorker
            exp_annotations:
              summary: 스케줄러(src.backend.notification.scheduler.NotificationOutboxWorker)가 주기의 3배 넘게 성공하지 않았다

  # 2대 운영(Ruling 915 B): 락을 가진 인스턴스 a 가 멈추고 인스턴스 b 는 락을 못 얻어 건너뛰기만 한다. 건너뜀은 outcome="SKIPPED" 로 따로 세므로 SUCCESS 합계가 늘지 않아
  # 정지 경보가 발화한다(건너뜀을 SUCCESS 로 세던 때는 b 의 SUCCESS 가 늘어 경보가 영영 꺼져 있었다). b 가 락을 넘겨받아 SUCCESS 가 다시 늘면 꺼진다.
  - interval: 15s
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="judgeMovingRuns",code_namespace="src.backend.location.scheduler.ProximityNotificationScheduler",error="none",exception="none",outcome="SUCCESS",instance="a"}'
        values: '0+1x8 8x70'   # a: 2분 무렵 멈춘다
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="judgeMovingRuns",code_namespace="src.backend.location.scheduler.ProximityNotificationScheduler",error="none",exception="none",outcome="SUCCESS",instance="b"}'
        values: '0x78'   # b: 성공 실행이 없다
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="judgeMovingRuns",code_namespace="src.backend.location.scheduler.ProximityNotificationScheduler",error="none",exception="none",outcome="SKIPPED",instance="b"}'
        values: '0+1x78'   # b: 락을 못 얻어 건너뛰기만 한다
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="confirmDueRuns",code_namespace="src.backend.run.scheduler.RunConfirmationScheduler",error="none",exception="none",outcome="SUCCESS",instance="a"}'
        values: '0+1x80'   # 확정 배치는 계속 돈다
    alert_rule_test:
      - eval_time: 3m   # 멈춘 지 1분 — 창에 아직 증가가 남아 for 가 안 찼다
        alertname: SchedulerStalled
        exp_alerts: []
      - eval_time: 4m30s   # b 의 건너뜀이 계속 늘어도 근접 판정 정지가 발화한다
        alertname: SchedulerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.location.scheduler.ProximityNotificationScheduler
            exp_annotations:
              summary: 스케줄러(src.backend.location.scheduler.ProximityNotificationScheduler)가 주기의 3배 넘게 성공하지 않았다
  - interval: 15s   # b 가 락을 넘겨받아 SUCCESS 를 다시 올리면 경보가 없다
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="judgeMovingRuns",code_namespace="src.backend.location.scheduler.ProximityNotificationScheduler",error="none",exception="none",outcome="SUCCESS",instance="a"}'
        values: '0+1x8 8x70'
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="judgeMovingRuns",code_namespace="src.backend.location.scheduler.ProximityNotificationScheduler",error="none",exception="none",outcome="SUCCESS",instance="b"}'
        values: '0x8 0+1x70'   # b: 2분 무렵부터 성공 실행이 늘기 시작한다
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="confirmDueRuns",code_namespace="src.backend.run.scheduler.RunConfirmationScheduler",error="none",exception="none",outcome="SUCCESS",instance="a"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 4m30s
        alertname: SchedulerStalled
        exp_alerts: []

  - interval: 15s   # 확정 배치의 시리즈가 사라지면(성공 실행이 없다) absent 가 발화한다
    input_series:
      - series: 'up{job="backend"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: SchedulerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.run.scheduler.RunConfirmationScheduler
              outcome: SUCCESS
            exp_annotations:
              summary: 스케줄러(src.backend.run.scheduler.RunConfirmationScheduler)가 주기의 3배 넘게 성공하지 않았다

  # ── 시리즈가 1 이상으로 태어나는 경우(기본 계측 · 지연 등록 카운터는 첫 사건 때 1 로 생긴다) — 0 → 1 이 아니라 `_ → 1` 이라 increase() 만으로는 0 이다.

  # 일일 회차 생성의 첫 실패(outcome=ERROR 시리즈가 1 로 태어남)도 1시간 창 안에서는 발화하고, 창을 지나면 꺼진다.
  - interval: 1m
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="generateTodayAndTomorrow",code_namespace="src.backend.schedule.scheduler.DailyRunGenerator",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '_x5 1x200'
    alert_rule_test:
      - eval_time: 3m   # 아직 태어나지 않았다
        alertname: DailyRunGenerationFailing
        exp_alerts: []
      - eval_time: 15m   # 5분 무렵 1 로 태어남 — 1시간 창 안
        alertname: DailyRunGenerationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.schedule.scheduler.DailyRunGenerator
            exp_annotations:
              summary: 일일 회차 생성(DailyRunGenerator)이 실패했다 — 그날 회차가 만들어지지 않아 기사·학부모 알림이 나가지 않는다
      - eval_time: 90m   # 태어난 지 창(1시간)을 넘었다
        alertname: DailyRunGenerationFailing
        exp_alerts: []

  # 미승차 에스컬레이션의 첫 실행 실패(outcome=ERROR 시리즈가 1 로 태어남).
  - interval: 30s
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="escalateDueNoShowCases",code_namespace="src.backend.exception.scheduler.NoShowEscalationScheduler",error="none",exception="IllegalStateException",outcome="ERROR"}'
        values: '_x10 1x60'
    alert_rule_test:
      - eval_time: 4m
        alertname: NoShowEscalationFailing
        exp_alerts: []
      - eval_time: 6m   # 5분 무렵 1 로 태어남 — 3분 창 안
        alertname: NoShowEscalationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              code_namespace: src.backend.exception.scheduler.NoShowEscalationScheduler
            exp_annotations:
              summary: 미승차 에스컬레이션 처리가 실패하고 있다 — 3분 안에 보고되지 않는 미승차가 생긴다
      - eval_time: 12m
        alertname: NoShowEscalationFailing
        exp_alerts: []

  # 미승차 에스컬레이션의 건별 실패 카운터가 첫 사건 때 1 로 태어남(지연 등록).
  - interval: 30s
    input_series:
      - series: 'schoolbus_scheduler_failures_total{job="backend",application="school-bus",scheduler="no-show-escalation"}'
        values: '_x10 1x60'
    alert_rule_test:
      - eval_time: 6m
        alertname: NoShowEscalationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              scheduler: no-show-escalation
            exp_annotations:
              summary: 미승차 에스컬레이션 처리가 실패하고 있다 — 3분 안에 보고되지 않는 미승차가 생긴다
      - eval_time: 12m
        alertname: NoShowEscalationFailing
        exp_alerts: []

  # 지도 API 서킷: 닫혀 있지 않은 상태(open · half_open)가 2분 유지돼야 발화한다.
  # 장애가 이어지면 open(10초) → half_open(시험 호출) → open 으로 오가며 `open` 게이지만 보면 매번 끊겨 for 가 안 찬다 — 그래서 closed 가 0 인지를 본다.
  - interval: 15s
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="backend",application="school-bus",name="mapRoute",state="closed"}'
        values: '1x8 0x60'
      - series: 'resilience4j_circuitbreaker_state{job="backend",application="school-bus",name="mapRoute",state="open"}'
        values: '0x8 1x2 0x2 1x2 0x2 1x2 0x2 1x2 0x2 1x2 0x2 1x2 0x2 1x2 0x2 1x2 0x2 1x2'   # open ↔ half_open 반복
      - series: 'resilience4j_circuitbreaker_state{job="backend",application="school-bus",name="geocoding",state="closed"}'
        values: '1x68'
      - series: 'resilience4j_circuitbreaker_state{job="school-bus-load",application="school-bus",name="mapRoute",state="closed"}'
        values: '0x68'   # 부하 시험은 실패를 일부러 주입한다
    alert_rule_test:
      - eval_time: 3m   # 닫히지 않은 지 1분 — pending
        alertname: CircuitBreakerNotClosed
        exp_alerts: []
      - eval_time: 6m
        alertname: CircuitBreakerNotClosed
        exp_alerts:
          - exp_labels:
              severity: warning
              name: mapRoute
            exp_annotations:
              summary: 지도 API 서킷(mapRoute)이 2분 넘게 닫히지 않았다(열림·반열림 반복 포함) — 해당 호출이 막히거나 대체값으로 처리된다

  - interval: 15s   # 부하 시험 프로파일의 서킷만 열려 있다(백엔드 시리즈 없음) — 실패를 일부러 주입하는 시험이라 조용해야 한다
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="school-bus-load",name="mapRoute",state="closed"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: CircuitBreakerNotClosed
        exp_alerts: []

  - interval: 15s   # 90초만 열렸다 닫힘 — 조용하다
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="backend",name="mapRoute",state="closed"}'
        values: '1x8 0x6 1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: CircuitBreakerNotClosed
        exp_alerts: []

  # Redis 서킷(name="redis"): 닫히지 않은 상태가 1분 유지돼야 RedisFallbackActive 가 발화하고, 지도 API 용 CircuitBreakerNotClosed 는 이 서킷을 보지 않는다.
  # 열림 ↔ 반열림이 오가므로 closed 가 0 인지를 본다. 서킷 상태 게이지는 기동 때 만들어져 첫 실패 계열 보정이 필요 없다.
  - interval: 15s
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="backend",application="school-bus",name="redis",state="closed"}'
        values: '1x8 0x60'
      - series: 'resilience4j_circuitbreaker_state{job="backend",application="school-bus",name="redis",state="open"}'
        values: '0x8 1x20 0x2 1x20 0x2 1x16'
      - series: 'resilience4j_circuitbreaker_state{job="school-bus-load",application="school-bus",name="redis",state="closed"}'
        values: '0x68'   # 부하 시험은 Redis 를 일부러 멈추기도 한다
    alert_rule_test:
      - eval_time: 2m30s   # 닫히지 않은 지 30초 — pending
        alertname: RedisFallbackActive
        exp_alerts: []
      - eval_time: 4m
        alertname: RedisFallbackActive
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backend
            exp_annotations:
              summary: Redis 서킷이 1분 넘게 닫히지 않았다 — 최신 좌표는 DB 이력으로, 방송은 이 인스턴스의 구독자에게만 직접, 미리보기 · 감사 묶기는 인스턴스 안 기억으로 돌고 있다(DEPLOYMENT.md §8)
      - eval_time: 8m   # 8분 동안 닫히지 않았어도 지도 API 용 규칙은 이 서킷을 보지 않는다
        alertname: CircuitBreakerNotClosed
        exp_alerts: []

  - interval: 15s   # 45초만 열렸다 닫힘 — 조용하다
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="backend",name="redis",state="closed"}'
        values: '1x8 0x3 1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: RedisFallbackActive
        exp_alerts: []

  - interval: 15s   # 부하 시험 프로파일의 Redis 서킷만 열려 있다(백엔드 시리즈 없음) — 조용해야 한다
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="school-bus-load",name="redis",state="closed"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: RedisFallbackActive
        exp_alerts: []
