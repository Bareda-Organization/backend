# alerts.yml 규칙 단위 시험 중 시험 구간이 25~80시간인 "정지 · 낡음" 경보 — 평가 간격을 1분으로 둔다(alerts.long-N.test.yml 3개는 같은 성격이고 CI 가 따로 병렬로 돌린다).
#   15초 간격(alerts.test.yml)으로 돌리면 이 그룹들만 4분 넘게 걸린다. 그룹마다 sample 간격이 1분 이상이고 기대 결과는 같다.
#   docker run --rm -v "$PWD/infra/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.15.0 test rules /p/alerts.long-3.test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # 보존 정리의 첫 성공도 같다 — 태어난 지 3일 안에는 조용하다.
  - interval: 1h
    input_series:
      - series: 'tasks_scheduled_execution_seconds_count{job="backend",application="school-bus",code_function="cleanUp",code_namespace="src.backend.global.retention.RetentionCleanupScheduler",error="none",exception="none",outcome="SUCCESS"}'
        values: '_x20 1x200'
    alert_rule_test:
      - eval_time: 30h   # 태어난 지 10시간
        alertname: RetentionCleanupStalled
        exp_alerts: []
      - eval_time: 100h   # 태어난 지 80시간 · 3일 창에 증가 없음
        alertname: RetentionCleanupStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backend
              code_namespace: src.backend.global.retention.RetentionCleanupScheduler
            exp_annotations:
              summary: 보존 정리(retention-cleanup)가 3일 넘게 성공하지 않았다 — 보존 기간이 지난 데이터 삭제와 퇴원 학생 개인정보 파기가 멈췄다

  # 인증서 갱신(BR-334): certbot 컨테이너가 12시간마다 시도하고 오류 없이 끝났을 때만 성공 시각을 쓴다. 2일(172800초) 넘게 성공하지 않으면 — 연속 4번 실패 — for(5m)를 채운 뒤 울린다.
  # 갱신은 만료 30일 전부터 시도하므로 이 시점에도 만료까지 28일 가까이 남아 있다. 시험에서 시각 0 = 시계 원점.
  - interval: 1m   # 샘플 간격이 5분(조회 한도)보다 길면 시계열이 사라져 for(5m)가 안 찬다 — 하루를 넘는 시험도 1분 간격으로 둔다
    input_series:
      - series: 'schoolbus_certbot_renew_last_success_timestamp_seconds{instance="stale"}'
        values: '0x3000'
      - series: 'schoolbus_certbot_renew_last_success_timestamp_seconds{instance="healthy"}'
        values: '0+60x3000'   # 값이 시계와 같이 올라간다 — 방금 성공한 것
    alert_rule_test:
      - eval_time: 47h   # 한두 번 실패한 정도(경과 169200초)
        alertname: CertbotRenewStale
        exp_alerts: []
      - eval_time: 49h   # 172800초를 넘은 지 1시간 — for(5m)를 채웠다
        alertname: CertbotRenewStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: stale
            exp_annotations:
              summary: 인증서 갱신(certbot)이 2일 넘게 성공하지 않았다 — 만료 전에 고치지 않으면 모든 클라이언트의 HTTPS 연결이 한꺼번에 거절된다
