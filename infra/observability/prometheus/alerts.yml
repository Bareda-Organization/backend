# TECH_DECISIONS §13.4 알럿 — 조건 · 지표 이름은 그 표를 따른다(BR-064).
# 전달 경로: 운영 compose 의 Alertmanager 가 텔레그램·이메일로 보낸다(Ruling 480 ④ — 값은 SSM 선택 항목, 없으면 수신자 없음이라
# Prometheus 화면(/alerts)에서만 보인다). 개발용 compose 에는 Alertmanager 가 없다.
# 규칙 문법·발화 조건은 alerts.test.yml 이 promtool 로 검사한다:
#   docker run --rm -v "$PWD/infra/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.15.0 test rules /p/alerts.test.yml
groups:
  - name: schoolbus
    rules:
      # "미승차 에스컬레이션이 3분 초과 미보고 — 즉시" — 건별 실패(스케줄러가 삼킨 것)와 주기 정지 둘 다 본다.
      - alert: NoShowEscalationFailing
        expr: increase(schoolbus_scheduler_failures_total{scheduler="no-show-escalation"}[3m]) > 0
        labels:
          severity: critical
        annotations:
          summary: 미승차 에스컬레이션 처리가 실패하고 있다 — 3분 안에 보고되지 않는 미승차가 생긴다
      - alert: NoShowEscalationStalled
        expr: schoolbus_scheduler_last_success_age_seconds{scheduler="no-show-escalation"} > 180
        labels:
          severity: critical
        annotations:
          summary: 미승차 에스컬레이션 스케줄러가 3분 넘게 성공하지 않았다
      # "운행 중 회차의 위치가 2분 이상 미수신 — 경고"
      - alert: RunPositionLost
        expr: schoolbus_run_position_lost > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 위치가 2분 넘게 안 들어오는 운행 중 회차가 있다
      # 운행일이 어제보다 이른데 끝나지 않은 이동 중 회차(R46-KFIXBE K-1 · Ruling 701·702). 근접 판정 · 위치 유실 · 노선 잠금은 그 회차를 더는
      # 집지 않으므로(위 RunPositionLost 가 영구히 켜져 새 유실을 가리지 않게 뺀 것) 이 경보가 그 회차를 사람에게 드러내는 유일한 신호다. 자동으로
      # 끝내지 않는다 — 처리는 DEPLOYMENT §11.2 의 절차. 게이지는 10분마다 갱신되고 새로 생기는 건은 날짜가 바뀔 때뿐이라 for 30m 이면 충분하다.
      - alert: StaleMovingRun
        expr: schoolbus_run_moving_stale > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 운행일이 어제보다 이른데 끝나지 않은 이동 중 회차가 있다 — 근접 판정과 위치 유실 경보가 더는 보지 않는다
      # "confirm_at + 5분 경과인데 idle 인 회차 ≥ 1 — 즉시"(§13.4 1행). 게이지가 이미 5분 여유를 반영한 값이라 0 초과면
      # 기사가 노선을 못 받은 채 출발 시각이 지난 것이다. 게이지는 30초마다 갱신되니 for 1m 이면 두 번 연속 관측 뒤 발화한다.
      # 이 규칙이 확정 배치 실패의 1차 방어다 — 강제 확정(POST /admin/runs/{runId}/force-confirm)은 그다음 수단이다.
      - alert: RunUnconfirmed
        expr: schoolbus_run_unconfirmed > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 확정 시각을 5분 넘긴 미확정 회차가 있다 — 기사가 노선을 받지 못했다
      # "알림 발송 실패율 임계 초과 — 경고"(§13.4 5행). 지표는 재시도를 전부 소진해 failed 로 굳은 건수뿐이고 분모(시도 수)
      # 지표가 없어 율이 아니라 건수로 본다. 임계는 실제 운영 값을 본 뒤 조정한다 — 앱에 Firebase 가 없으면(조사 C #14) 모든
      # 발송이 실패로 굳어 이 경보가 계속 발화하고, 그것이 맞는 신호다.
      - alert: PushDeliveryFailing
        expr: increase(schoolbus_notification_push_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 재시도를 소진해 실패로 굳은 푸시 알림이 최근 10분 안에 있다
      # 호스트 루트 디스크 80% — DB 볼륨 · 사진 · 이미지 · 로그가 같은 디스크라 차면 postgres 쓰기가 실패해 전면 정지다.
      # 값은 node-exporter(--path.rootfs=/host · pid: host)가 내는 마운트 지점 `/` 기준이다.
      - alert: HostDiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 호스트 루트 디스크 사용률이 80% 를 넘은 지 10분 됐다
      # 백업이 멈추면 아무도 모른다 — 실패는 크론 로그에만 남는다. backup-db.sh 가 S3 업로드를 마친 뒤에만 쓰는 성공 시각을
      # node-exporter textfile 수집기가 내보내고, 그 시각이 오래되면 울린다(R46 ops2 · Ruling 500). DB 는 매시 백업이라 2시간
      # (한 번은 빠질 수 있고 두 번 연속이면 목표 유실 1시간이 깨진다) · 사진은 매일이라 26시간. `or absent` — 크론이 안 돌아
      # 지표 파일이 없는 경우도 같은 경보다. 첫 배포 직후 첫 백업까지(최대 1시간)는 울릴 수 있어 절차서가 손으로 1회 돌리게 한다.
      - alert: BackupDbStale
        expr: (time() - schoolbus_backup_db_last_success_timestamp_seconds > 7200) or absent(schoolbus_backup_db_last_success_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: DB 백업이 2시간 넘게 성공하지 않았다 — 목표 유실 1시간(RPO)이 깨지고 있다
      - alert: BackupPhotosStale
        expr: (time() - schoolbus_backup_photos_last_success_timestamp_seconds > 93600) or absent(schoolbus_backup_photos_last_success_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 학생 사진 백업이 26시간 넘게 성공하지 않았다

  # ── 백엔드 가용성(R46-FIXOPS · review-stab S-1 · Ruling 640) ────────────────────────────────────────────
  # 위 규칙들은 대부분 백엔드가 떠 있어야 값이 생기는 지표를 본다 — 백엔드가 죽으면 시계열이 사라져(스크레이프 실패 때 Prometheus 가 즉시
  # 끝낸 것으로 표시) 이미 발화 중이던 경보도 해소로 바뀌고 새 경보도 안 생긴다. 그래서 BackendDown 이 먼저 울려야 하고, 그 사이
  # 미확정 회차 · 위치 유실 · 푸시 실패는 지표로 볼 수 없다. 아래 규칙은 전부 `job="backend"` 로 걸러 부하 시험 프로파일(다른 스택이
  # 다른 job 이름으로 긁는다 · 풀 10 · 실패 주입이 정상)을 보지 않는다 — 개발용 compose 의 Prometheus 는 Alertmanager 가 없어
  # 발화해도 /alerts 화면에만 보인다.
  - name: schoolbus-availability
    rules:
      # `up == 0` 은 대상이 있고 스크레이프가 실패한 경우, absent 는 대상이 목록에서 사라져 up 시계열이 아예 없는 경우다(둘 다 같은 경보).
      - alert: BackendDown
        expr: up{job="backend"} == 0 or absent(up{job="backend"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 백엔드가 1분 넘게 응답하지 않는다 — 이 동안 백엔드 지표에 기대는 다른 경보(미확정 회차·위치 유실·푸시 실패)는 값이 없어 울리지 않는다
      # actuator 와 /healthz 는 뺀다 — 스크레이프(15초)와 컨테이너 헬스체크(15초)가 요청 수에 늘 섞이고, Redis 가 죽으면 헬스가 503 이 된다.
      # 운영 계열은 /actuator 가 관리 포트로 옮겨 가 이 지표에 잡히지 않는다(실측) — 앱 포트에 남는 헬스 주소는 외부 감시가 치는 /healthz 뿐이다(Ruling 740).
      # 분당 6건(0.1/s) 미만이면 판정하지 않는다 — 새벽에 한두 건 실패로 비율이 50% 가 되는 것을 막는다.
      - alert: Http5xxRatioHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend",status=~"5..",uri!~"/actuator.*|/healthz"}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="backend",uri!~"/actuator.*|/healthz"}[5m])) > 0.05
          and
          sum(rate(http_server_requests_seconds_count{job="backend",uri!~"/actuator.*|/healthz"}[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 최근 5분 요청의 5% 넘게 5xx 로 응답했다(actuator·/healthz 제외 · 분당 6건 이상일 때만 판정)
      # 풀(운영 20개)이 마르면 연결을 얻으려고 3초(connection-timeout) 기다린 뒤 500 이 나간다. 대기가 1분 이어지면 순간 몰림이 아니다.
      - alert: HikariPoolWaiting
        expr: hikaricp_connections_pending{job="backend"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: DB 연결을 기다리는 요청이 1분 넘게 계속 있다 — 풀이 마르면 3초 뒤 500 이 나간다
      # 장애가 이어지면 open(10초) → half_open(시험 호출 3번) → open 으로 오가서 `state="open"` 게이지는 매번 0 으로 끊긴다 — for 가
      # 안 찬다. 그래서 `closed` 가 0 인지(= 열림이거나 반열림)를 본다. 인스턴스는 geocoding · mapRoute · placeSearch 셋이다.
      # TECH_DECISIONS §13.4 4행 — 폴백으로 계산 중이라 품질 저하(경고).
      - alert: CircuitBreakerNotClosed
        expr: max by (name) (resilience4j_circuitbreaker_state{job="backend",state="closed"}) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 지도 API 서킷({{ $labels.name }})이 2분 넘게 닫히지 않았다(열림·반열림 반복 포함) — 해당 호출이 막히거나 대체값으로 처리된다
      # 마지막 성공 경과가 주기의 3배를 넘은 채 1분 — 확정·아웃박스는 30초 주기(90초), 근접 판정은 10초(30초). for 는 긴 한 틱을 거른다:
      # 100회차 동시 확정 드레인이 59~85초라 경과가 115초까지 갔다가 내려온다. 이름은 SchedulerHealthMetrics.nameOf 규칙(클래스명 케밥) 그대로다.
      # 주기를 yml(poll-interval-ms)로 바꾸면 이 숫자도 같이 바꾼다. 미승차 에스컬레이션은 위의 전용 규칙이 따로 본다.
      - alert: SchedulerStalled
        expr: |
          schoolbus_scheduler_last_success_age_seconds{job="backend",scheduler=~"run-confirmation|notification-outbox-worker"} > 90
          or
          schoolbus_scheduler_last_success_age_seconds{job="backend",scheduler="proximity-notification"} > 30
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 스케줄러({{ $labels.scheduler }})가 주기의 3배 넘게 성공하지 않았다
      # 하루 한 번(00:15) 도는 작업이라 3일(259200초). 앱을 재기동하면 경과가 0 부터 다시 세어지므로 3일 안에 한 번이라도 재배포하면 이 규칙은 못 본다 —
      # 정리가 계속 실패하는 경우는 건별 실패 카운터(schoolbus_scheduler_failures_total)가 따로 있다.
      - alert: RetentionCleanupStalled
        expr: schoolbus_scheduler_last_success_age_seconds{job="backend",scheduler="retention-cleanup"} > 259200
        labels:
          severity: warning
        annotations:
          summary: 보존 정리(retention-cleanup)가 3일 넘게 성공하지 않았다 — 보존 기간이 지난 데이터 삭제와 퇴원 학생 개인정보 파기가 멈췄다
      # 위치 이력 파티션 미리 만들기(매일 00:10 · 7일 앞까지, Ruling 670). 3일 멈춰도 아직 4일치가 남아 있어 그 안에 알린다 —
      # 8일 넘게 멈추면 기본 파티션에 행이 쌓이고, 뒤늦게 그 날짜 파티션을 만들 때 하루치(약 27만 행)를 한 번에 옮긴다.
      - alert: RunPositionPartitionStalled
        expr: schoolbus_scheduler_last_success_age_seconds{job="backend",scheduler="run-position-partition"} > 259200
        labels:
          severity: warning
        annotations:
          summary: 위치 이력 파티션 미리 만들기(run-position-partition)가 3일 넘게 성공하지 않았다 — 남은 미리 만든 파티션이 4일치 이하
      # 동시 연결 상한(Tomcat max-connections 4,000 · Ruling 690)의 75% — STOMP 세션 수가 3,000 을 5분 넘게 넘으면 울린다(Ruling 691).
      # 상한에 닿으면 새 연결이 거절되고(REST 포함) 그때는 이미 늦으니 4분의 1 남았을 때 알린다. for 5분은 서버 재시작 뒤 클라이언트가 한꺼번에
      # 다시 붙는 순간 몰림을 거른다. 목표 동시 세션은 2,000 이라 평소에는 울리지 않는다. 상한(application.yml)을 바꾸면 이 숫자도 75% 로
      # 같이 바꾼다 — OpsSettingsGuardTest 가 둘의 관계를 지킨다. HTTP 요청도 같은 연결 수에 들지만 프록시가 요청마다 연결을 닫아(upstream
      # keepalive 없음) 세션 수가 연결 수를 거의 그대로 대표한다.
      - alert: StompSessionsNearCap
        expr: schoolbus_stomp_sessions{job="backend"} > 3000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 실시간(WebSocket) 세션이 3,000 을 5분 넘게 넘었다 — 동시 연결 상한 4,000 에 닿으면 새 연결이 거절된다
