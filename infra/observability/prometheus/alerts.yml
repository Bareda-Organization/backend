# TECH_DECISIONS §13.4 알럿 — 조건 · 지표 이름은 그 표를 따른다(BR-064).
# 전달 경로: 운영 compose 에 Alertmanager 자리는 있으나 수신 채널이 미정이라(Ruling 454) 어디로도 보내지 않는다 —
# Prometheus 화면(/alerts)에서 발화 여부만 보인다. 개발용 compose 에는 Alertmanager 가 없다.
# 규칙 문법·발화 조건은 alerts.test.yml 이 promtool 로 검사한다:
#   docker run --rm -v "$PWD/infra/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.1.0 test rules /p/alerts.test.yml
groups:
  - name: schoolbus
    rules:
      # "미승차 에스컬레이션이 3분 초과 미보고 — 즉시" — 건별 실패(스케줄러가 삼킨 것)와 주기 정지 둘 다 본다.
      - alert: NoShowEscalationFailing
        expr: increase(schoolbus_scheduler_failures_total{scheduler="no-show-escalation"}[3m]) > 0
        labels:
          severity: critical
        annotations:
          summary: 미승차 에스컬레이션 처리가 실패하고 있다 — 3분 안에 보고되지 않는 미승차가 생긴다
      - alert: NoShowEscalationStalled
        expr: schoolbus_scheduler_last_success_age_seconds{scheduler="no-show-escalation"} > 180
        labels:
          severity: critical
        annotations:
          summary: 미승차 에스컬레이션 스케줄러가 3분 넘게 성공하지 않았다
      # "운행 중 회차의 위치가 2분 이상 미수신 — 경고"
      - alert: RunPositionLost
        expr: schoolbus_run_position_lost > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 위치가 2분 넘게 안 들어오는 운행 중 회차가 있다
      # "confirm_at + 5분 경과인데 idle 인 회차 ≥ 1 — 즉시"(§13.4 1행). 게이지가 이미 5분 여유를 반영한 값이라 0 초과면
      # 기사가 노선을 못 받은 채 출발 시각이 지난 것이다. 게이지는 30초마다 갱신되니 for 1m 이면 두 번 연속 관측 뒤 발화한다.
      # 이 규칙이 확정 배치 실패의 1차 방어다 — 강제 확정(POST /admin/runs/{runId}/force-confirm)은 그다음 수단이다.
      - alert: RunUnconfirmed
        expr: schoolbus_run_unconfirmed > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 확정 시각을 5분 넘긴 미확정 회차가 있다 — 기사가 노선을 받지 못했다
      # "알림 발송 실패율 임계 초과 — 경고"(§13.4 5행). 지표는 재시도를 전부 소진해 failed 로 굳은 건수뿐이고 분모(시도 수)
      # 지표가 없어 율이 아니라 건수로 본다. 임계는 실제 운영 값을 본 뒤 조정한다 — 앱에 Firebase 가 없으면(조사 C #14) 모든
      # 발송이 실패로 굳어 이 경보가 계속 발화하고, 그것이 맞는 신호다.
      - alert: PushDeliveryFailing
        expr: increase(schoolbus_notification_push_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 재시도를 소진해 실패로 굳은 푸시 알림이 최근 10분 안에 있다
      # 호스트 루트 디스크 80% — DB 볼륨 · 사진 · 이미지 · 로그가 같은 디스크라 차면 postgres 쓰기가 실패해 전면 정지다.
      # 값은 node-exporter(--path.rootfs=/host · pid: host)가 내는 마운트 지점 `/` 기준이다.
      - alert: HostDiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 호스트 루트 디스크 사용률이 80% 를 넘은 지 10분 됐다
      # 백업이 멈추면 아무도 모른다 — 실패는 크론 로그에만 남는다. backup-db.sh 가 S3 업로드를 마친 뒤에만 쓰는 성공 시각을
      # node-exporter textfile 수집기가 내보내고, 그 시각이 오래되면 울린다(R46 ops2 · Ruling 500). DB 는 매시 백업이라 2시간
      # (한 번은 빠질 수 있고 두 번 연속이면 목표 유실 1시간이 깨진다) · 사진은 매일이라 26시간. `or absent` — 크론이 안 돌아
      # 지표 파일이 없는 경우도 같은 경보다. 첫 배포 직후 첫 백업까지(최대 1시간)는 울릴 수 있어 절차서가 손으로 1회 돌리게 한다.
      - alert: BackupDbStale
        expr: (time() - schoolbus_backup_last_success_timestamp_seconds{kind="db"} > 7200) or absent(schoolbus_backup_last_success_timestamp_seconds{kind="db"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: DB 백업이 2시간 넘게 성공하지 않았다 — 목표 유실 1시간(RPO)이 깨지고 있다
      - alert: BackupPhotosStale
        expr: (time() - schoolbus_backup_last_success_timestamp_seconds{kind="photos"} > 93600) or absent(schoolbus_backup_last_success_timestamp_seconds{kind="photos"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 학생 사진 백업이 26시간 넘게 성공하지 않았다
