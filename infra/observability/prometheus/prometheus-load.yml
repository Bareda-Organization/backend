# 부하 시험 전용 설정 — docker-compose.observe.yml 이 쓴다. 평시 개발용 prometheus.yml 과는
# 두 가지가 다르다.
#
# 1. 스크레이프 주기 2~5초 — 부하 회차가 60~300초로 짧아, 15초 주기로는 점이 4~20개뿐이라
#    포화 지점(예: 힙이 튀는 수초 구간)을 놓친다.
# 2. 알림 규칙(alerts.yml)을 안 싣는다 — 부하 시험은 스텁 지연 주입·강제 실패로 대상이 자주
#    내려가는 게 정상이라, 운영 알림 조건을 그대로 켜 두면 매 회차 오경보만 쌓인다.
global:
  scrape_interval: 3s
  evaluation_interval: 3s

scrape_configs:
  # 부하 시험은 SPRING_PROFILES_ACTIVE=load 로 뜬 앱을 호스트에서 돈다 — application-load.yml 이
  # 포트를 18080 으로 고정한다(docs/backend/LOAD_TESTING.md §0·§6.1, backend/load/start_sized.sh).
  # ⚠ 평시 개발 포트 8080 이 아니다 — 헷갈리기 쉬운 지점이라 적어 둔다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:18080']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # Prometheus 자기 자신 — 스크레이프가 밀리는지 보기 위해 둔다.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
