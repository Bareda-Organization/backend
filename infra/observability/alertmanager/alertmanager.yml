# 경보 라우팅 자리 — **수신 채널은 사용자 결정 대기**(R46 ops, Ruling 454)라 지금은 알림을 어디로도 보내지 않는다.
# 발화 중인 경보는 Prometheus 화면(/alerts — SSM 포트 포워딩, DEPLOYMENT.md §11)에서만 보인다.
#
# 채널이 정해지면 아래 `unrouted` 대신 실제 receiver 를 넣는다. 자격 증명(봇 토큰·웹훅 URL·SMTP 비밀번호)은
# 이 파일에 적지 않는다 — 저장소가 공개다. SSM 에 두고 deploy.sh · compose 로 파일·환경변수를 넘기는 방식을 새로 정한다.
#   telegram_configs · slack_configs · email_configs · webhook_configs 중 하나
route:
  receiver: unrouted
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # 수신자 없음 — 알림을 보내지 않는다.
  - name: unrouted
