# 스테이징 엣지 프록시 — Cloudflare Tunnel 이 이 프록시(proxy:80)로 인터넷 요청을 바로 붙인다(docker-compose.staging.yml).
#
# 개발용 infra/proxy/nginx.conf 를 바탕으로 **운영 nginx.prod.conf 의 보호 3가지**를 더했다(BR-230). TLS 는 Cloudflare 가
# 종단하므로 여기에 없다. 개발용 파일을 그대로 쓰면 공개 주소에서 인증 경로가 속도 제한 없이 열리고 감사 IP 가 전부 터널 주소가 된다.
#   1. 인증 경로(로그인·가입·복구·자녀 연결)에 요청 수 제한 — 경로 목록은 nginx.prod.conf 와 같아야 한다(StagingProxyConfigTest).
#   2. Swagger UI·OpenAPI 문서는 공개하지 않는다(404). 운영은 basic auth 지만 그 계정 파일을 만들 사람이 스테이징엔 없다.
#   3. 터널 뒤 실제 접속자 IP — Cloudflare 가 실어 주는 CF-Connecting-IP 를 신뢰 목록(터널 컨테이너가 속한 사설 대역)의
#      요청에서만 채택한다. 그래야 $remote_addr 가 접속자 IP 가 되어 백엔드 감사 IP(X-Real-IP)와 속도 제한 기준이 맞다.
#
# 설정 문법 확인(컨테이너를 띄우지 않는다) — compose 와 같은 이미지 태그로:
#   docker run --rm --add-host backend:127.0.0.1 --add-host web:127.0.0.1 \
#     -v "$PWD/infra/proxy/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
#
# ── 백엔드 ──
# least_conn: 요청 처리 시간이 들쭉날쭉한 API(배차 계산 등)에는 라운드로빈보다
# "연결이 적은 쪽"으로 보내는 편이 쏠림이 덜하다.
upstream backend_pool {
    least_conn;
    server backend:8080;

    # ⚠️ 여기에 인스턴스를 더 추가하기 전에 반드시 먼저 해결할 것:
    #   (1) @Scheduled 4개(위치 시뮬·연결끊김·근접/미승차·SOS 에스컬레이션)가
    #       인스턴스마다 돌아 알림이 중복 발송된다 → 리더 선출 또는 분산 락 필요
    #   (2) 위치 저장소가 InMemory(ConcurrentHashMap)라 인스턴스 간 공유가 안 된다
    #       → 기사가 A에 보고한 좌표를 관리자가 B에서 조회하면 안 보인다. Redis 전환 필요
    #   (3) WebSocket 세션(LocationSessionRegistry)이 인스턴스에 묶여 있다
    #       → 최소한 ip_hash 등 세션 어피니티, 제대로 하려면 Redis STOMP 브로커 릴레이
    # 상세: docs/backend/ARCHITECTURE.md
}

# ── 관계자 웹 ──
# Next.js standalone 서버. 백엔드와 달리 다중화 제약이 없다(상태를 들지 않는다).
upstream web_pool {
    server web:3000;
}

# 인증 경로 무차별 대입 완화 — 접속자 IP 당 분당 20회(nginx.prod.conf 와 같은 값). 시드 계정 비밀번호가 하나로 공유되므로
# 제한이 없으면 외부에서 대입하거나 팀원 계정을 일괄 차단시킬 수 있다.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    # 터널 뒤 실제 접속자 IP. 신뢰 대역은 docker 기본 네트워크가 쓰는 사설 대역이다 — 이 프록시에 닿는 것은 같은 네트워크의
    # cloudflared 와 호스트 루프백(127.0.0.1:3100)뿐이라, 인터넷의 요청이 이 대역 주소로 들어올 수 없다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # 사진 업로드 여지를 둔다.
    client_max_body_size 10m;

    # 프록시 공통 헤더 — 백엔드가 원래 요청자를 알 수 있게 한다.
    # 이게 없으면 Spring 이 보는 클라이언트 IP 가 전부 프록시 IP 가 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 추측·잠금 대상 경로 (요청 수 제한 적용) ──
    # nginx.prod.conf 와 같은 경로 — 로그인 · 가입·재신청 · 복구 · 자녀 연결. 정규식 location 은 prefix location(/api/)보다 먼저 선택된다.
    location ~ ^/api/v1/(auth/(login|signup|signup/reapply|recover)|me/students/link)$ {
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_pool;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket(STOMP) ──
    # 프로토콜 업그레이드는 HTTP/1.1 + Upgrade/Connection 헤더가 필수다.
    # 이 블록이 없으면 브라우저 콘솔에 이유 없는 연결 실패만 남는다.
    location /ws/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # ⚠️ nginx 상속 규칙: 한 location 안에서 proxy_set_header 를 **하나라도** 쓰면
        # server 레벨의 proxy_set_header 는 전부 상속되지 않는다. 그래서 공통 헤더를
        # 여기서 다시 적어야 한다 — 빠뜨리면 Host 가 업스트림 이름(backend_pool)으로
        # 나가고 핸드셰이크가 400 으로 거절된다(실제로 겪음).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 클라이언트·서버 heartbeat 가 10초라 그보다 넉넉히 잡는다.
        # 짧으면 조용한 연결을 프록시가 먼저 끊어버려 재연결이 반복된다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Swagger UI · OpenAPI 문서: 공개하지 않는다 ──
    # 개발용은 무인증으로 열지만 이 주소는 인터넷에 열려 있다. API 스펙은 로컬(`localhost:8080`)에서 본다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    # ── 앱 설치 파일(APK) 내려받기 — 스테이징 전용 ──
    # docker-compose.staging.yml 만 ./downloads 를 이 경로에 마운트한다. 개발용에서는 폴더가 없어 404 다.
    # 폴더 목록을 보여 주므로 QR 하나(`/download/`)로 두 앱을 다 받을 수 있다.
    location /download/ {
        alias /usr/share/nginx/downloads/;
        autoindex on;
        # nginx 기본 mime.types 에 apk 가 없어 octet-stream 으로 나간다 — 설치 파일로 알려 준다.
        types { application/vnd.android.package-archive apk; }
    }

    # ── 관계자 웹 (Next.js) ──
    # API·WS·Swagger 가 아닌 나머지 전부. Next.js 는 `/_next/` 정적 자산도 자기가 서빙하므로
    # 경로를 따로 가르지 않고 통째로 넘긴다.
    # ⚠ 이 블록은 **맨 마지막**이어야 한다 — nginx 의 접두사 location 은 가장 긴 일치가 이기지만
    #   `/` 는 모든 경로에 일치하므로, 위의 `/api/`·`/ws/` 보다 먼저 두면 의미가 뒤집혀 보인다.
    location / {
        proxy_pass http://web_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
