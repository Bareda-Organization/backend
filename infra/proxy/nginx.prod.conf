# 운영(데모) 엣지 프록시 — 인터넷에서 닿는 유일한 진입점이며 TLS 를 여기서 종단한다.
#
# 로컬용 infra/proxy/nginx.conf 와의 차이:
#   1. 443(TLS)을 받는다. 80 은 ACME 챌린지와 HTTPS 리다이렉트에만 쓴다.
#   2. `/`(화면) 라우팅이 없다 — 관계자 웹은 Vercel 에서 따로 서빙한다(Ruling 481 · docs/infra/DEPLOYMENT.md §12). 이 서버의 `/` 는 404 다.
#   3. Swagger UI 는 basic auth 로 막는다(공개 데모에 API 스펙을 그대로 열어둘 이유가 없다).
#   4. /actuator 는 외부에서 차단한다(컨테이너 내부 healthcheck 전용). 외부 가동 감시용으로 /healthz 하나만 연다.
#   5. 로그인에 요청 수 제한을 건다(공개 URL 이므로 무차별 대입 시도가 실제로 들어온다).
#
# ⚠️ 아래 자리표시자 도메인을 **실제 도메인으로 바꿔야 한다.** nginx 설정 파일은 환경변수를
#    못 읽는다. `api.example.com` 4곳(server_name 2곳 + ssl_certificate·ssl_certificate_key
#    각 1곳)이다. 웹 주소(`app.<도메인>`)는 이 파일에 없다 — 허용 출처는 SSM(CORS_ALLOWED_ORIGINS ·
#    WS_ALLOWED_ORIGIN_PATTERNS)이 갖는다. 한 번에 바꾸려면:
#      sed -i '' 's/api\.example\.com/api.내도메인.com/g' infra/proxy/nginx.prod.conf
#    (macOS 기준. Linux 는 `sed -i` 로 따옴표 없이.)
#    ⚠️ 반드시 **저장소에서 고쳐 커밋**한다 — EC2 의 파일을 직접 고치면 다음 배포의
#       `aws s3 sync ... --delete` 가 말없이 되돌린다. 절차는 docs/infra/DEPLOYMENT.md §2.11.

# ── 백엔드 ──
upstream backend_pool {
    server backend:8080;

    # ⚠️ 여기에 인스턴스를 추가하면 안 된다. 먼저 해결해야 할 것:
    #   (1) @Scheduled 4개가 인스턴스마다 돌아 알림이 중복 발송된다 → 리더 선출 또는 분산 락
    #   (2) 버스 위치가 InMemoryBusLocationRepository 라 인스턴스 간 공유가 안 된다
    #       (학생 위치는 RedisLocationRepository 로 이미 해결됨)
    #   (3) WebSocket STOMP 세션이 인스턴스에 묶여 있다 → Redis 브로커 릴레이 필요
    #   상세: docs/archive/specs/2026-08-10-mvp-배포-design.md §4.2
}

# 로그인 무차별 대입 완화 — IP 당 분당 20회. 공개 도메인이라 봇이 실제로 두드린다.
# 정상 사용자가 이 한도에 걸릴 일은 없다(로그인은 세션당 1~2회).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;

# 공개 헬스 — 호출 한 번이 backend 의 DB·Redis 점검을 부른다. 외부 감시는 보통 분당 1회라 넉넉히 두되 무한 호출은 막는다.
limit_req_zone $binary_remote_addr zone=health_zone:1m rate=30r/m;

# ── 80: ACME 챌린지 + HTTPS 리다이렉트 ──
server {
    listen 80;
    server_name api.example.com;

    # certbot 이 도메인 소유를 증명하는 경로. 이 블록이 리다이렉트보다 위에 있어야 한다 —
    # 아래로 내리면 챌린지 요청까지 https 로 튕겨 갱신이 실패한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443: 실제 서비스 ──
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    # 인증서는 infra/certbot/init-cert.sh 로 최초 발급하고, certbot 컨테이너가 12시간마다 갱신한다.
    # ⚠️ 이 파일들이 없으면 nginx 가 기동 자체를 못 한다 — 최초 발급을 먼저 끝낼 것.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # certbot 이 만들어주는 options-ssl-nginx.conf 를 include 하지 않고 직접 적는다 —
    # 그 파일이 없는 환경에서 기동 실패하는 걸 피하기 위해서다.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 한번 https 로 접속한 브라우저가 이후 http 시도를 아예 하지 않게 한다.
    # ⚠️ 도메인 운영을 https 로 계속 갈 확신이 설 때만 켠다. 되돌리려면 max-age 만큼 기다려야 한다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 화면 자산을 서빙하지 않으므로 크게 잡을 필요는 없지만, 사진 업로드 여지를 둔다.
    client_max_body_size 10m;

    # 프록시 공통 헤더 — 이게 없으면 Spring 이 보는 클라이언트 IP 가 전부 프록시 IP 가 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 추측·잠금 대상 경로 (요청 수 제한 적용) ──
    # 로그인(비밀번호·남의 계정 5회 잠금) · 가입·재신청 · 복구(인증 코드) · 자녀 연결(연결 코드).
    # ⚠ 경로는 API 접두사(/api/v1, Ruling 102)를 포함한다 — 옛 /api/auth/login 은 존재하지 않는 경로라
    # 제한이 한 번도 걸리지 않았다(BR-035). refresh 는 넣지 않는다 — 추측 대상이 아니고, 같은 IP
    # (통신사 공용 IP)를 쓰는 다수 사용자의 정상 재발급이 한도에 걸린다.
    # 정규식 location 은 prefix location(/api/)보다 먼저 선택된다.
    location ~ ^/api/v1/(auth/(login|signup|signup/reapply|recover)|me/students/link)$ {
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_pool;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 토큰·코드가 실리는 응답 — 압축하지 않는다(BREACH) ──
    # 압축 크기는 응답 안의 비밀 값(액세스·재발급 토큰, 연결 코드)이 공격자가 요청에 섞어 넣은 값과 얼마나 겹치는지를 드러낸다 — 응답 길이를 보는 공격이라
    # 암호(TLS)로도 못 가린다. 그래서 `/api/` 의 압축에서 인증 응답 전부(재발급 · 로그아웃 · 비밀번호 변경 · 가입 상태 …)와 연결 코드 발급을 뺀다.
    # 위 속도 제한 location(로그인 · 가입 · 복구 · 자녀 연결)은 압축을 켜지 않은 별도 location 이라 그대로 압축되지 않는다. 이 둘은 `/api/` 와 형제라 상속이 없다 —
    # proxy 지시자를 다시 적고, `gzip off` 는 나중에 server 수준에 압축을 켜도 이 응답이 빠지게 하는 명시다.
    location /api/v1/auth/ {
        gzip off;
        proxy_pass http://backend_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /api/v1/me/link-code {
        gzip off;
        proxy_pass http://backend_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── API ──
    # 응답 압축 — 관제 폴링(`/admin/academies/{id}/runs/live` 약 55KB · 7초 간격)처럼 키가 반복되는 JSON 은 8~10배 줄어든다(review-load L7).
    # 1KB 미만은 압축 비용이 이득보다 커서 거른다. 이미지(사진)·WebSocket 은 대상이 아니다(JSON 만).
    location /api/ {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_vary on;
        proxy_pass http://backend_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket(STOMP) ──
    # 프로토콜 업그레이드는 HTTP/1.1 + Upgrade/Connection 헤더가 필수다.
    location /ws/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # ⚠️ nginx 상속 규칙: 한 location 안에서 proxy_set_header 를 **하나라도** 쓰면
        # server 레벨의 proxy_set_header 는 전부 상속되지 않는다. 그래서 공통 헤더를
        # 여기서 다시 적어야 한다 — 빠뜨리면 Host 가 업스트림 이름으로 나가고
        # 핸드셰이크가 400 으로 거절된다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 클라이언트·서버 heartbeat 가 10초라 그보다 넉넉히 잡는다.
        # 짧으면 조용한 연결을 프록시가 먼저 끊어버려 재연결이 반복된다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Swagger UI (basic auth 보호) ──
    # 포트폴리오라 API 스펙을 보여줄 가치가 있어 남기되, 아무나 열지는 못하게 한다.
    # 계정 파일(.htpasswd)은 저장소·S3 를 거치지 않고 **EC2 에서 직접 생성**한다 —
    # 절차는 docs/infra/DEPLOYMENT.md §2.12 참조.
    location ~ ^/(swagger-ui|v3/api-docs) {
        auth_basic           "School Bus API Docs";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend_pool;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 공개 헬스 (외부 가동 감시용) ──
    # UptimeRobot 같은 외부 감시가 칠 주소다. backend 의 헬스만 프록시한다 — 응답은 상태 문자열뿐이다
    # ({"status":"UP"}, management.endpoint.health.show-details: never). DB·Redis 가 DOWN 이면 503 이라
    # backend 가 죽었거나 저하된 것을 밖에서 알 수 있다 — 정적 200 은 backend 가 죽어도 초록이다.
    # 접근 로그는 남기지 않는다(감시가 1분마다 쳐 CloudWatch 로그만 불린다). 아래 차단은 이 한 주소 밖의 전부에 그대로 걸린다.
    location = /healthz {
        limit_req zone=health_zone burst=10 nodelay;
        limit_req_status 429;
        access_log off;

        proxy_pass http://backend_pool/actuator/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ── Actuator 차단 ──
    # 컨테이너 내부 healthcheck 는 localhost:8080 으로 직접 치므로 외부 통로가 필요 없다.
    # 열어두면 DB·Redis 연결 정보나 빈 목록이 노출될 수 있다.
    location /actuator {
        return 404;
    }

    # ── 나머지 ──
    # 서빙할 화면이 없다(웹은 Vercel — Ruling 481). API·WebSocket·Swagger·/healthz 밖은 전부 404 로 끊는다.
    location / {
        return 404;
    }
}
