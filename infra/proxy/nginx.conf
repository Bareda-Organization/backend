# 엣지 리버스 프록시 — 브라우저가 닿는 유일한 진입점(:80).
#
# `/api`·`/ws`·`/swagger-ui` 는 백엔드로, 나머지 `/` 는 관계자 웹(Next.js)으로 보낸다.
# (2026-09-18 — 그 전에는 백엔드 전용이라 `/` 가 404 였다.)
#
# 이 프록시가 하는 일:
#  1. 백엔드를 호스트 포트에 직접 노출하지 않아도 된다.
#  2. upstream 블록에 서버를 추가하는 것만으로 로드밸런싱으로 확장할 수 있다.
#     개발·스테이징은 백엔드 1대다. 2대 구성은 운영 파일(docker-compose.scale.yml · backend-pool.scale.conf)에서 한다 — docs/backend/infra/DEPLOYMENT.md §15.

# ── 백엔드 ──
# least_conn: 요청 처리 시간이 들쭉날쭉한 API(배차 계산 등)에는 라운드로빈보다
# "연결이 적은 쪽"으로 보내는 편이 쏠림이 덜하다.
upstream backend_pool {
    least_conn;
    server backend:8080;

    # 이 파일의 백엔드는 1대다(개발·스테이징). 서버를 더하는 방법과 2대에서 보장되는 것(중복 실행 방지 · 인스턴스 간 메시지 중계 · 공유 캐시):
    # docs/backend/ARCHITECTURE.md §9.5 · docs/backend/infra/DEPLOYMENT.md §15
}

# ── 관계자 웹 ──
# Next.js standalone 서버. 백엔드와 달리 다중화 제약이 없다(상태를 들지 않는다).
upstream web_pool {
    server web:3000;
}

# WebSocket 동시 연결 — IP 당 100개(Ruling 899 D). 통신사 공용 IP 뒤의 학부모 여러 명을 막지 않도록 낮게 두지 않는다.
limit_conn_zone $binary_remote_addr zone=ws_conn_zone:10m;

server {
    listen 80;
    server_name _;

    # 사진 업로드 여지를 둔다.
    client_max_body_size 10m;

    # 프록시 공통 헤더 — 백엔드가 원래 요청자를 알 수 있게 한다.
    # 이게 없으면 Spring 이 보는 클라이언트 IP 가 전부 프록시 IP 가 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API ──
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket(STOMP) ──
    # 프로토콜 업그레이드는 HTTP/1.1 + Upgrade/Connection 헤더가 필수다.
    # 이 블록이 없으면 브라우저 콘솔에 이유 없는 연결 실패만 남는다.
    location /ws/ {
        limit_conn ws_conn_zone 100;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # ⚠️ nginx 상속 규칙: 한 location 안에서 proxy_set_header 를 **하나라도** 쓰면
        # server 레벨의 proxy_set_header 는 전부 상속되지 않는다. 그래서 공통 헤더를
        # 여기서 다시 적어야 한다 — 빠뜨리면 Host 가 업스트림 이름(backend_pool)으로
        # 나가고 핸드셰이크가 400 으로 거절된다(실제로 겪음).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 클라이언트·서버 heartbeat 가 10초라 그보다 넉넉히 잡는다.
        # 짧으면 조용한 연결을 프록시가 먼저 끊어버려 재연결이 반복된다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── 개발 편의: Swagger UI ──
    # API 스펙을 같은 주소에서 바로 열어보기 위함이다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend_pool;
    }

    # ── 앱 설치 파일(APK) 내려받기 — 스테이징 전용 ──
    # docker-compose.staging.yml 만 ./downloads 를 이 경로에 마운트한다. 개발용에서는 폴더가 없어 404 다.
    # 폴더 목록을 보여 주므로 QR 하나(`/download/`)로 두 앱을 다 받을 수 있다.
    location /download/ {
        alias /usr/share/nginx/downloads/;
        autoindex on;
        # nginx 기본 mime.types 에 apk 가 없어 octet-stream 으로 나간다 — 설치 파일로 알려 준다.
        types { application/vnd.android.package-archive apk; }
    }

    # ── 관계자 웹 (Next.js) ──
    # API·WS·Swagger 가 아닌 나머지 전부. Next.js 는 `/_next/` 정적 자산도 자기가 서빙하므로
    # 경로를 따로 가르지 않고 통째로 넘긴다.
    # ⚠ 이 블록은 **맨 마지막**이어야 한다 — nginx 의 접두사 location 은 가장 긴 일치가 이기지만
    #   `/` 는 모든 경로에 일치하므로, 위의 `/api/`·`/ws/` 보다 먼저 두면 의미가 뒤집혀 보인다.
    location / {
        proxy_pass http://web_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
