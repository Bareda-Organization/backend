# 엣지 리버스 프록시 — 브라우저가 닿는 유일한 진입점(:80).
#
# 이 저장소는 백엔드 API 전용이다 — `/` 로 서빙할 화면이 없다.
#
# 이 프록시가 하는 일:
#  1. 백엔드를 호스트 포트에 직접 노출하지 않아도 된다.
#  2. upstream 블록에 서버를 추가하는 것만으로 로드밸런싱으로 확장할 수 있다.
#     ⚠️ 다만 백엔드는 **아직 다중화하면 안 된다** — 아래 upstream 주석 참조.

# ── 백엔드 ──
# least_conn: 요청 처리 시간이 들쭉날쭉한 API(배차 계산 등)에는 라운드로빈보다
# "연결이 적은 쪽"으로 보내는 편이 쏠림이 덜하다.
upstream backend_pool {
    least_conn;
    server backend:8080;

    # ⚠️ 여기에 인스턴스를 더 추가하기 전에 반드시 먼저 해결할 것:
    #   (1) @Scheduled 4개(위치 시뮬·연결끊김·근접/미승차·SOS 에스컬레이션)가
    #       인스턴스마다 돌아 알림이 중복 발송된다 → 리더 선출 또는 분산 락 필요
    #   (2) 위치 저장소가 InMemory(ConcurrentHashMap)라 인스턴스 간 공유가 안 된다
    #       → 기사가 A에 보고한 좌표를 관리자가 B에서 조회하면 안 보인다. Redis 전환 필요
    #   (3) WebSocket 세션(LocationSessionRegistry)이 인스턴스에 묶여 있다
    #       → 최소한 ip_hash 등 세션 어피니티, 제대로 하려면 Redis STOMP 브로커 릴레이
    # 상세: docs/ARCHITECTURE.md
}

server {
    listen 80;
    server_name _;

    # 사진 업로드 여지를 둔다.
    client_max_body_size 10m;

    # 프록시 공통 헤더 — 백엔드가 원래 요청자를 알 수 있게 한다.
    # 이게 없으면 Spring 이 보는 클라이언트 IP 가 전부 프록시 IP 가 된다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API ──
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket(STOMP) ──
    # 프로토콜 업그레이드는 HTTP/1.1 + Upgrade/Connection 헤더가 필수다.
    # 이 블록이 없으면 브라우저 콘솔에 이유 없는 연결 실패만 남는다.
    location /ws/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # ⚠️ nginx 상속 규칙: 한 location 안에서 proxy_set_header 를 **하나라도** 쓰면
        # server 레벨의 proxy_set_header 는 전부 상속되지 않는다. 그래서 공통 헤더를
        # 여기서 다시 적어야 한다 — 빠뜨리면 Host 가 업스트림 이름(backend_pool)으로
        # 나가고 핸드셰이크가 400 으로 거절된다(실제로 겪음).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 클라이언트·서버 heartbeat 가 10초라 그보다 넉넉히 잡는다.
        # 짧으면 조용한 연결을 프록시가 먼저 끊어버려 재연결이 반복된다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── 개발 편의: Swagger UI ──
    # API 스펙을 같은 주소에서 바로 열어보기 위함이다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend_pool;
    }

    # ── 나머지 ──
    # 서빙할 화면이 없다. 위 세 경로 밖은 전부 404 로 끊는다.
    location / {
        return 404;
    }
}
