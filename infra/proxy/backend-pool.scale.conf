# 백엔드 2대 구성의 업스트림 — docker-compose.scale.yml 이 /etc/nginx/backend-pool.conf 로 마운트한다(1대 구성은 backend-pool.single.conf).
#
#  - least_conn : WebSocket 은 연결 하나가 오래 살아 라운드로빈이면 재접속이 몰린 쪽에 세션이 쌓인다. 연결이 적은 쪽으로 보낸다.
#  - max_fails · fail_timeout : 한 대가 연결을 거절하거나 응답하지 않으면 fail_timeout 동안 그 대를 풀에서 뺀다. max_fails=0 이면 실패를 세지 않아
#    멈춘 대에도 요청이 계속 가고, 요청마다 연결 시도 실패(proxy_connect_timeout 5s)를 기다린 뒤 다른 대로 넘어간다.
#  - resolve + resolver : 컨테이너를 다시 만들면 IP 가 바뀐다. nginx 는 기동할 때 이름을 한 번만 풀므로 resolve 가 없으면 배포 뒤에 옛 IP 로 계속 간다.
#    Docker 내장 DNS(127.0.0.11)를 5초마다 다시 물어 새 IP 를 따라가고, 멈춘 컨테이너(이름이 풀리지 않음)는 풀에서 뺀다. zone 은 resolve 의 전제다.
#    ⚠ 이 파일을 고쳐 나가는 서버(backend2 등)를 늘릴 때는 docker-compose.scale.yml 에도 같은 서비스를 더한다.
upstream backend_pool {
    zone backend_pool 64k;
    least_conn;
    server backend:8080  max_fails=2 fail_timeout=10s resolve;
    server backend2:8080 max_fails=2 fail_timeout=10s resolve;
}

resolver 127.0.0.11 valid=5s ipv6=off;
