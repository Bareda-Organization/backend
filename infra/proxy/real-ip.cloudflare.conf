# 터널 뒤 실제 접속자 IP — Cloudflare Tunnel 용(STAGING_REAL_IP_CONF=./infra/proxy/real-ip.cloudflare.conf). nginx.staging.conf 의 server 블록이 포함한다.
#
# Cloudflare 는 요청마다 CF-Connecting-IP 를 접속자 주소로 **덮어쓴다** — 접속자가 보낸 값은 남지 않는다. 이 헤더만 신뢰한다.
# X-Forwarded-For 는 접속자가 앞에 값을 붙여 보낼 수 있어 읽지 않는다.
# 신뢰 대역은 docker 기본 네트워크가 쓰는 사설 대역이다 — 이 프록시에 닿는 것은 같은 네트워크의 cloudflared 와 호스트 루프백(127.0.0.1:3100)뿐이라,
# 인터넷의 요청이 이 대역 주소로 들어올 수 없다.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
