# 운영 엣지 프록시의 전역 설정(/etc/nginx/nginx.conf) — nginx:1.31.6-alpine 이미지의 기본 파일에서 연결 한도만 바꾼 것이다.
# 이미지 기본값은 worker_processes auto · worker_connections 1024 다. server·location 은 nginx.prod.conf(conf.d/default.conf)에 있다.
#
# ⚠ worker_connections 는 클라이언트 쪽 연결과 backend 쪽 연결을 합쳐 센다 — 프록시한 WebSocket 1개가 연결 2개를 쓴다.
#   기본값 1024 면 워커 하나가 동시 세션 약 500개, 2 vCPU(워커 2개)에서도 약 1,000개에서 새 연결(REST 포함)을 버리고
#   `worker_connections are not enough` 를 오류 로그에만 남긴다. backend 는 그 연결을 본 적이 없어 StompSessionsNearCap 도 울리지 않는다(BR-328).
# 값의 근거 — Tomcat 동시 연결 상한(prod max-connections 4,000)을 프록시가 먼저 막지 않게 한다:
#   worker_connections 16384 = 상한 4,000 × 2(클라이언트 + backend) = 8,000 의 2배. 연결이 한 워커에 몰릴 수 있어(워커마다 따로 센다)
#                              코어 수와 무관하게 워커 하나가 상한을 담는다. 남는 절반은 포트 80 리다이렉트 · 일반 REST · TLS 핸드셰이크 중인 연결의 몫이다.
#   worker_rlimit_nofile 32768 = worker_connections 의 2배(연결마다 파일 기술자 1개 + 로그·소켓 여유). docker-compose.prod.yml 의 ulimits 가 이 값 이상을 보장한다.
# 이 숫자는 OpsSettingsGuardTest 가 application.yml 의 max-connections 와 compose 의 ulimits 에 맞는지 본다 — 상한을 올리면 여기도 올린다.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  32768;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
