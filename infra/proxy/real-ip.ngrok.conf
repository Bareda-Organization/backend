# 터널 뒤 실제 접속자 IP — ngrok 용(docker-compose.staging.yml 의 기본값). nginx.staging.conf 의 server 블록이 포함한다.
#
# ngrok 은 CF-Connecting-IP 를 모른다 — 그 헤더는 접속자가 마음대로 보낼 수 있으므로 읽지 않는다.
# 신뢰하는 것은 ngrok 이 요청에 덧붙이는 X-Forwarded-For 의 **마지막** 값(real_ip_recursive off 가 마지막 값을 고른다)뿐이다 —
# 접속자가 앞에 어떤 값을 붙여 보내도 ngrok 이 덧붙인 값이 마지막이다.
# 신뢰 대역은 docker 기본 네트워크가 쓰는 사설 대역이다 — 이 프록시에 닿는 것은 같은 네트워크의 ngrok 과 호스트 루프백(127.0.0.1:3100)뿐이라,
# 인터넷의 요청이 이 대역 주소로 들어올 수 없다.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
