# ─────────────────────────────────────────────────────────────────────────────
# 스테이징 — 팀원 체험용 서버. **이 파일 하나로 혼자 돈다**(개발용 두 파일과 겹쳐 쓰지 않는다).
# 집 PC 1대에서 전부 돌고, 바깥 공개는 Cloudflare Tunnel 이 맡는다(공유기 포트 개방 불필요).
# 절차: docs/backend/infra/STAGING.md
#
#   docker compose -f docker-compose.staging.yml up -d --build
#
# 개발용(docker-compose.yml + .app.yml)과 다른 점
#   - 백엔드 프로파일이 `local,staging` — 데모 시드·버스 시뮬레이터는 그대로, 공개된 비밀번호·JWT 키는
#     staging 섹션이 덮는다(application.yml 맨 끝)
#   - 테스트 데이터 초기화 3갈래가 전부 시드 상태로 되돌린다(Ruling 364) — 웹 머리말의 [테스트 데이터 초기화]
#     버튼 · `docker compose restart backend` · 매일 새벽 cron. 시드의 운행 시각이 "초기화 시각 기준" 이라
#     하루 한 번은 초기화해야 버스가 움직인다(문서의 매일 초기화 절)
#   - 관측 스택(Grafana·Prometheus) 없음 · 모든 서비스 자동 재시작
#   - /download/ 에서 APK 를 내려준다(./downloads 폴더)
# ─────────────────────────────────────────────────────────────────────────────
# 개발용 compose 와 컨테이너·네트워크 이름이 겹치지 않게 프로젝트 이름을 고정한다.
name: school-bus-staging

services:
  postgres:
    image: postgres:18.6
    # 운영 compose 와 같은 두 옵션(쿼리별 통계 · 임의 읽기 비용 1.1 — 메모리 DB 라 더더욱 맞다). 확장은 아래 초기화 스크립트가 `ops_stats` 스키마에 만든다 —
    # 이 서버는 백엔드가 기동·초기화마다 Flyway clean() 으로 public 을 비우는데, public 에 만든 확장은 그때 같이 지워진다(2026-10-01 실측).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # 데이터는 메모리에만 — 디스크에 쌓이지 않는다. 초기화 자체는 백엔드가 기동·/dev/reset 때 DB 를 비우고
    # 스키마+시드를 새로 깐다(staging 섹션이 이 컨테이너 이름 `postgres` 를 비워도 되는 호스트로 연다).
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    # 저장하지 않는다 — DB 와 함께 재시작마다 비워진다(버스 위치는 어차피 2분짜리 값이다).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    build: ./backend
    # 종료 신호 뒤 SIGKILL 까지의 시간 — 운영과 같은 값(스프링 graceful 종료 30초보다 길게). `docker compose restart backend`(초기화)도 이 시간을 쓴다.
    stop_grace_period: 35s
    # 네이버 API 키 등. git 에 없는 파일이라 집 PC 로 따로 복사해 온다(문서 참고).
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: local,staging
      # QA 서버는 Directions 5 로 경로를 받는다(2026-10-03 사용자 지시 — Directions 15 는 한도가 작아 아낀다).
      # 경로와 지점 상한은 짝이다(Ruling 361 · application.yml 공통 블록 주석). 확정 1회 = 호출 2회(학원 + 승하차지 10곳).
      NAVER_DIRECTIONS_PATH: /map-direction/v1/driving
      NAVER_DIRECTIONS_MAX_POINTS: "7"
      # OutOfMemoryError 가 나면 프로세스를 끝낸다 — 스레드만 죽은 채 "실행 중"으로 남으면 `restart: unless-stopped` 가 못 본다(운영과 같은 이유 ·
      # 힙 상한은 두지 않는다: 이 서버는 컨테이너 메모리 한도가 없다).
      JAVA_TOOL_OPTIONS: "-XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolbus
      SPRING_DATASOURCE_USERNAME: schoolbus
      SPRING_DATASOURCE_PASSWORD: schoolbus
      SPRING_DATA_REDIS_HOST: redis
      # application.yml 기본값 16379 는 개발 PC 호스트 포트다 — 컨테이너 안의 redis 는 6379.
      SPRING_DATA_REDIS_PORT: 6379
      # ⚠ 아래 넷은 `.env` 에서 받는다. 비어 있으면 compose 가 기동 전에 멈춘다.
      SEED_PASSWORD_HASH: ${SEED_PASSWORD_HASH:?.env 에 시드 계정 비밀번호의 BCrypt 해시가 필요하다}
      JWT_SECRET: ${JWT_SECRET:?.env 에 32바이트 이상 임의 문자열이 필요하다}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?.env 에 공개 주소(https://...)가 필요하다}
      WS_ALLOWED_ORIGIN_PATTERNS: ${PUBLIC_URL}
    expose:
      - "8080"
    # 컨테이너 헬스체크 — staging 프로파일은 헬스·지표를 관리 포트(8081)에 둔다(application.yml · 운영과 같은 근거 Ruling 740). 이미지에 curl 이 있다(backend/Dockerfile).
    # proxy 가 이 값을 기다려, backend 가 안 뜨면 `up` 단계에서 unhealthy 로 드러난다. OpsSettingsGuardTest 가 포트·proxy 조건을 지킨다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 관계자 웹 — 빌드 컨텍스트가 형제 저장소 `../web` 인 이유는 docker-compose.app.yml 의 web 주석과 같다.
  web:
    build:
      context: ../web
      args:
        # 브라우저 번들에 박히는 주소 — 공개 주소 그대로. 바꾸면 web 이미지를 다시 빌드해야 한다.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL}
        # 머리말에 [테스트 데이터 초기화] 버튼을 보인다(Ruling 364). 개발용 compose 에는 없다.
        NEXT_PUBLIC_TEST_DATA_RESET: "true"
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  # 라우팅은 개발용 설정에 운영의 보호(인증 경로 속도 제한 · Swagger 차단 · 터널 뒤 접속자 IP)를 더한 스테이징 전용 파일이다(BR-230) —
  # /api·/ws → backend, /download → APK, 나머지 → web.
  proxy:
    image: nginx:1.31.6-alpine
    ports:
      # 집 PC 자신에서 확인할 때만 쓴다(127.0.0.1 — 공유기 안 다른 기기에도 안 열린다).
      # 바깥 공개는 아래 cloudflared 가 컨테이너 네트워크로 proxy:80 에 직접 붙는다.
      - "127.0.0.1:3100:80"
    volumes:
      - ./infra/proxy/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # Cloudflare Tunnel — 집 PC 가 먼저 Cloudflare 로 연결을 열어 두고, 공개 주소 요청을 그 연결로 받는다.
  # 공개 주소 → 서비스 대상은 Cloudflare 대시보드에서 `http://proxy:80` 으로 지정한다(문서 참고).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?.env 에 Cloudflare Tunnel 토큰이 필요하다}
    depends_on:
      - proxy
    restart: unless-stopped
