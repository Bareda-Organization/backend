# ─────────────────────────────────────────────────────────────────────────────
# 스테이징 — 팀원 체험용 서버. **이 파일 하나로 혼자 돈다**(개발용 두 파일과 겹쳐 쓰지 않는다).
# 집 PC 1대에서 전부 돌고, 바깥 공개는 Cloudflare Tunnel 이 맡는다(공유기 포트 개방 불필요).
# 절차: docs/infra/STAGING.md
#
#   docker compose -f docker-compose.staging.yml up -d --build
#
# 개발용(docker-compose.yml + .app.yml)과 다른 점
#   - 백엔드 프로파일이 `local,staging` — 데모 시드·버스 시뮬레이터는 그대로, 공개된 비밀번호·JWT 키·
#     /dev/reset 은 staging 섹션이 덮는다(application.yml 맨 끝)
#   - postgres 데이터가 메모리(tmpfs)에 있다 — 재기동하면 시드 상태로 돌아간다. 시드의 운행 시각이
#     "기동 시각 기준" 이라 매일 새로 깔아야 버스가 움직인다(문서의 매일 초기화 절)
#   - 관측 스택(Grafana·Prometheus) 없음 · 모든 서비스 자동 재시작
#   - /download/ 에서 APK 를 내려준다(./downloads 폴더)
# ─────────────────────────────────────────────────────────────────────────────
# 개발용 compose 와 컨테이너·네트워크 이름이 겹치지 않게 프로젝트 이름을 고정한다.
name: school-bus-staging

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
    # 데이터는 메모리에만 — 컨테이너가 재시작되면 빈 DB 로 뜨고 백엔드 Flyway 가 스키마+시드를 새로 깐다.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    # 저장하지 않는다 — DB 와 함께 재시작마다 비워진다(버스 위치는 어차피 2분짜리 값이다).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    build: ./backend
    # 네이버 API 키 등. git 에 없는 파일이라 집 PC 로 따로 복사해 온다(문서 참고).
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: local,staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolbus
      SPRING_DATASOURCE_USERNAME: schoolbus
      SPRING_DATASOURCE_PASSWORD: schoolbus
      SPRING_DATA_REDIS_HOST: redis
      # application.yml 기본값 16379 는 개발 PC 호스트 포트다 — 컨테이너 안의 redis 는 6379.
      SPRING_DATA_REDIS_PORT: 6379
      # ⚠ 아래 넷은 `.env` 에서 받는다. 비어 있으면 compose 가 기동 전에 멈춘다.
      SEED_PASSWORD_HASH: ${SEED_PASSWORD_HASH:?.env 에 시드 계정 비밀번호의 BCrypt 해시가 필요하다}
      JWT_SECRET: ${JWT_SECRET:?.env 에 32바이트 이상 임의 문자열이 필요하다}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?.env 에 공개 주소(https://...)가 필요하다}
      WS_ALLOWED_ORIGIN_PATTERNS: ${PUBLIC_URL}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 관계자 웹 — 빌드 컨텍스트가 ./frontend 인 이유는 docker-compose.app.yml 의 web 주석과 같다.
  web:
    build:
      context: ./frontend
      dockerfile: apps/academy-web/Dockerfile
      args:
        # 브라우저 번들에 박히는 주소 — 공개 주소 그대로. 바꾸면 web 이미지를 다시 빌드해야 한다.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  # 라우팅은 개발용과 같은 설정 파일을 쓴다 — /api·/ws·/swagger-ui → backend, /download → APK, 나머지 → web.
  proxy:
    image: nginx:alpine
    ports:
      # 집 PC 자신에서 확인할 때만 쓴다(127.0.0.1 — 공유기 안 다른 기기에도 안 열린다).
      # 바깥 공개는 아래 cloudflared 가 컨테이너 네트워크로 proxy:80 에 직접 붙는다.
      - "127.0.0.1:3100:80"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      - backend
      - web
    restart: unless-stopped

  # Cloudflare Tunnel — 집 PC 가 먼저 Cloudflare 로 연결을 열어 두고, 공개 주소 요청을 그 연결로 받는다.
  # 공개 주소 → 서비스 대상은 Cloudflare 대시보드에서 `http://proxy:80` 으로 지정한다(문서 참고).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?.env 에 Cloudflare Tunnel 토큰이 필요하다}
    depends_on:
      - proxy
    restart: unless-stopped
