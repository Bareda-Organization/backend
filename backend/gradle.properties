# 빌드 캐시 — 바뀌지 않은 태스크의 산출물을 재실행 없이 가져온다.
# 음성 대조가 "한 줄 심고 → 돌리고 → 원복하고 → 돌리고" 를 반복하므로, 그 왕복마다 무관한
# 태스크까지 다시 도는 비용이 실제 작업 시간의 대부분이다.
org.gradle.caching=true

# 설정 캐시 — 호출마다 다시 도는 configuration 단계를 건너뛴다.
# ⚠ 켜기만 하고 넘어가면 안 된다. 이 저장소는 Spring Boot 4 라 플러그인이 설정 캐시를 깨는
# 경우가 있어, 값을 바꾸면 실제로 한 번 돌려 BUILD SUCCESSFUL 을 눈으로 확인한 뒤 커밋한다.
org.gradle.configuration-cache=true

# ⛔ org.gradle.parallel 은 켜지 않는다 — 단일 모듈이라 이익이 부재하고, 이 호스트는
# 메모리가 병목이라(여유 73MB · 압축기 6.3GB 점유) 워커를 늘리면 페이징으로 오히려 느려진다.
