spring:
  application:
    name: backend
  profiles:
    active: local

  # API_SPEC 의 모든 필드가 snake_case 다(Ruling 104) — DTO 마다 @JsonProperty 를 손으로 붙이는 대신
  # 전역 네이밍 전략으로 고정한다. camelCase 자바 필드명을 자동 변환하므로, 새 DTO 를 추가할 때도
  # 이 규칙만 지키면 애너테이션 없이 API_SPEC 과 맞는다.
  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      # 학생 사진 업로드(§5.11)가 이 저장소의 유일한 멀티파트다. 기본값이 1MB 라 그대로 두면
      # 사양이 허용하는 5MB 사진이 톰캣에서 먼저 끊긴다.
      #
      # ⚠ 여기 값은 정책이 아니라 컨테이너 방어선이다 — 사양 상한 5MB 는 StudentPhoto 의 코드
      # 상수이고(횡단 규칙 10), 이 값은 그보다 위에 둬야 5~8MB 요청이 톰캣이 아니라 사양 검증에
      # 닿아 422 VALIDATION_FAILED 로 거부된다. 아래로 내리면 상한이 조용히 이 파일 값으로 바뀐다.
      max-file-size: 8MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://localhost:15432/schoolbus
    username: schoolbus
    password: schoolbus

  jpa:
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway(db/migration)가 관리 — Hibernate는 엔티티↔실제 스키마 일치만 검증
    open-in-view: false          # 실무 표준: 영속성 컨텍스트를 뷰까지 끌고 가지 않음
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration   # 스키마 마이그레이션(전 프로파일 공통). local·demo 프로파일은 시드 데이터 위치를 추가로 더한다.
    # Flyway 10+ 기본값도 true 이나, Spring 계층(전략 빈)이 전부 뚫려도 라이브러리 자체가
    # clean() 을 거부하도록 명시로 고정한다 — local 블록만 false 로 되돌린다(docs/IMPLEMENTATION_PLAN.md §3.2 겹4).
    clean-disabled: true

  data:
    redis:
      host: localhost
      port: 16379
      # 시간 상한(BR-166, W12-01) — 비우면 Lettuce 기본값 60초라, 답하지 않는 Redis 앞에서 DB 커넥션을 쥔 스레드가
      # 60초씩 묶여 풀(Hikari)이 마르고 전 API 가 멈춘다. 최신 좌표 단건·MGET 은 로컬망에서 ms 단위라 500ms 면
      # 정상 요청을 자르지 않고, 넘기면 좌표 조회는 run_position 최신 행으로 대체한다(TECH_DECISIONS §14.2).
      # 연결이 끊긴 동안의 명령을 쌓지 않고 즉시 거절하는 설정은 location/infrastructure/RedisClientConfig.
      timeout: 500ms
      connect-timeout: 1s

# 주소 → 좌표 변환 (C-18 네이버 확정, Ruling 157). stub 으로 바꾸면 결정론적 스텁이 뜬다 —
# 테스트 전체 묶음은 build.gradle 이 이 값을 stub 으로 넘겨 돈다(네트워크·요금·NCP 계정 상태가
# 판정을 바꾸면 그 초록은 코드에 대해 아무것도 말하지 않는다).
geocoding:
  provider: naver
  naver:
    # ⚠️ maps.apigw.ntruss.com 이다. 구 호스트 naveropenapi.apigw.ntruss.com 은 이 자격증명으로
    #    401 Permission Denied(errorCode 210)를 낸다 — 2026-08-26 실측.
    base-url: https://maps.apigw.ntruss.com
    # 새 이름을 우선하되 기존 NAVER_DIRECTIONS_* 로 폴백한다. NCP 자격증명은 상품별이 아니라
    # 애플리케이션 단위라 그 키가 Geocoding 에도 그대로 통하며, .env 를 고치지 않아도 되게 한다.
    # 이름이 사실과 어긋나 있으나(그 키는 Directions 전용이 아니다) 개명은 .env·docker-compose.prod.yml·
    # DEPLOYMENT.md 를 함께 건드리는 별도 단위다.
    key-id: ${NAVER_MAPS_KEY_ID:${NAVER_DIRECTIONS_KEY_ID:}}
    key: ${NAVER_MAPS_KEY:${NAVER_DIRECTIONS_KEY:}}

# 외부 지도 API 보호(횡단 규칙 11) — 보호를 호출자가 아니라 어댑터 설정에 둔다.
# 이것이 없으면 네이버 장애가 곧 주소 저장 불가가 된다.
resilience4j:
  retry:
    instances:
      geocoding:
        max-attempts: 3
        wait-duration: 200ms
        # 서킷이 이미 열려 호출을 막은 것은 재시도 대상이 아니다 — 재시도해 봐야 열린 서킷을
        # 세 번 두드리고 wait-duration 만큼 응답이 늦어질 뿐 공급자에는 닿지 않는다.
        #
        # 여기에 GeocodingUnavailableException 을 적으면 안 된다. 그것은 fallbackMethod 가 만드는
        # 포트 예외라, 적는 순간 "일시 실패를 재시도한다"는 이 설정 자체가 무력화된다.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      # 지도 경로도 같은 이유로 재시도를 둔다. wait-duration 이 지오코딩보다 짧은 것은 이쪽 호출자가
      # 승인 화면에서 대기 중일 수 있기 때문이다 — 주입한 타임아웃은 1회 요청의 상한이라, 재시도가
      # 붙으면 관리자가 실제로 기다리는 시간은 그 배수가 된다(ARCHITECTURE §8.3).
      mapRoute:
        max-attempts: 3
        wait-duration: 100ms
        # 다시 불러도 답이 같은 실패(4xx·경로 없음)는 재시도하지 않는다 — 타임아웃·연결 실패·5xx 만(BR-050).
        retry-exception-predicate: src.backend.routing.map.impl.TransientMapRouteFailure
        # 서킷 개방과 격벽 거부는 둘 다 "공급자에 닿지도 못한 것" 이라 재시도 대상이 아니다.
        # 재시도해 봐야 닫힌 문을 세 번 두드리고 wait-duration 만큼 응답만 늦어진다.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
      # 온디맨드(관리자가 화면 앞에서 대기 — 승인 미리보기·경유 지점·편성 도로 경로)는 한 번만 다시 부른다.
      # 재시도 횟수를 호출자가 고른다(ARCHITECTURE §8.3) — 배치와 같은 3회면 대기가 타임아웃의 3배가 된다.
      mapRouteOnDemand:
        max-attempts: 2
        wait-duration: 100ms
        retry-exception-predicate: src.backend.routing.map.impl.TransientMapRouteFailure
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  circuitbreaker:
    instances:
      geocoding:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # 최소 표본을 두지 않으면 첫 호출 한 번이 실패했을 때 실패율 100%로 서킷이 즉시 열린다.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      # 지오코딩과 값이 같으나 인스턴스를 가른다 — 네이버 Geocoding 이 죽었다고 Directions 호출까지
      # 막으면 주소 하나 때문에 노선 계산 전체가 근사값으로 떨어진다. 둘은 서로 다른 상품이다.
      mapRoute:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 실패로 세는 것은 재시도 분류(타임아웃·연결 실패·5xx, BR-208·BR-050)에 일일 한도 소진 429 를 더한 것이다
        # (Ruling 379 ⑤) — 429 는 재시도는 안 하되 서킷이 열려야 헛호출이 멈춘다. 그 밖의 4xx·"경로 없음" 은 요청
        # 데이터 탓이라 공급자가 멀쩡한데도 서킷을 열어 온디맨드 화면을 503 으로 만든다.
        record-failure-predicate: src.backend.routing.map.impl.MapRouteCircuitFailure
        # 격벽이 거부한 호출은 공급자 장애가 아니다 — 공급자는 멀쩡한데 우리가 스스로 막은 것이다.
        # 집계에 넣으면 동시 도래가 한 번 몰린 것만으로 실패율이 임계를 넘어 서킷이 열리고,
        # 그 순간부터 온디맨드가 503 을 받는다. 자기 보호 장치가 서로를 넘어뜨리는 형태다.
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
      # 장소 검색(자동완성 보조 후보, BR-163) — 재시도는 두지 않고 서킷만 둔다. 지오코딩과 다른 상품이라
      # 인스턴스를 가른다(지역 검색이 죽었다고 주소 검증까지 막지 않는다).
      placeSearch:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      # FCM 발송(R46 S-2) — 재시도는 아웃박스 워커가 맡으므로 서킷만 둔다. 값은 placeSearch 와 같다. 열린 동안의 발송은 행이
      # pending 으로 남아 워커(30초)가 이어받는다 — 알림이 최대 30초 늦어지는 것이 FCM 장애 중 발송 스레드 8개가 묶이는 것보다 낫다.
      fcm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    metrics:
      # 관측 목표 8행(TECH_DECISIONS §13.1) — 이 값이 없으면(기본값 false) resilience4j-spring-boot3
      # 가 만드는 지표 게시자는 CircuitBreakerRegistry 에 실제로 연결되지 않는다. 역참조로 확인한
      # 것: TaggedCircuitBreakerMetricsPublisher(기본 경로)는 MetricsPublisher 인터페이스를 구현하는데,
      # CircuitBreakerRegistry.of(...) 는 RegistryEventConsumer 만 받는 오버로드뿐이라 그 둘을 잇는
      # 어댑터가 이 classpath 어디에도 없다 — 등록은 되지만 아무 서킷과도 연결되지 않는 고아 빈이 된다.
      # legacy 경로(registerCircuitBreakerMetrics)는 반대로 CircuitBreakerRegistry 를 직접 받아
      # TaggedCircuitBreakerMetrics.ofCircuitBreakerRegistry(registry) 로 그 레지스트리의 이벤트
      # 발행기에 스스로 구독한다(MeterBinder) — 이름은 legacy 지만 이 조합에서 유일하게 동작하는 경로다.
      legacy:
        enabled: true
  # 동시 호출 수 제한(TECH_DECISIONS §8 · ARCHITECTURE §9.4) — 동시 도래가 몰려도 공급자
  # 레이트리밋을 넘지 않게 한다. 서킷·재시도가 "공급자가 이미 아플 때" 를 다룬다면 격벽은
  # "우리가 공급자를 아프게 만드는 것" 을 막는다.
  #
  # ⚠ 배치·온디맨드를 칸으로 나눈다(`Ruling 350`, BR-169) — 예전에는 인스턴스 하나(mapRoute, 4칸)를
  # 배치·온디맨드가 함께 썼다. 07:30 같은 확정 시각에 관리자 화면 조회 1건이 칸 하나를 쥐면 그만큼
  # 확정 배치가 못 들어가 회차 1건이 직선거리 근사로 확정됐다 — 화면은 사용자가 대기 중이 아니라
  # 다시 조회하면 회복되지만, 배치는 그 순간 확정을 놓치면 다음 틀에서만 재시도된다(부담이 비대칭).
  # 배치를 우선해 3칸 · 온디맨드 1칸으로 가른다 — 합계 4 = 아래 공급자 레이트리밋 잠정값 그대로 유지.
  bulkhead:
    instances:
      mapRouteBatch:
        # ⚠ NCP 가 공개한 레이트리밋을 실측하지 못해 보수적으로 잡은 잠정값이다(2026-08-29,
        # 4칸 기준). 공급자 제약이라 정책 상수가 아니라 환경 인프라값이고, 실측되면 두 칸 합(4)만
        # 고친다. 확정 워커 풀 기본값이 이 칸 수를 그대로 따른다(`RunConfirmationWorkerPoolConfig`).
        max-concurrent-calls: 3
        # 0 = 대기 없이 즉시 거부. 대기를 두면 호출자가 주입한 타임아웃 예산 밖의 시간이 앞에
        # 붙어, 관리자가 승인 화면에서 얼마를 기다릴지를 이 yml 값이 정하게 된다 —
        # ARCHITECTURE §8.3 이 타임아웃을 호출자 주입으로 정한 이유와 정면으로 어긋난다.
        # 거부의 결과는 이미 정의된 경로(단발 실패 → 직선거리 근사)로 흡수된다.
        max-wait-duration: 0
      # 화면 조회(승인 미리보기·경유 지점 지정·편성 화면)가 배치 칸을 빼앗지 않도록 격벽을 가른다.
      # 화면 쪽은 사용자가 대기 중이라 어차피 재시도가 적고(mapRouteOnDemand 재시도 인스턴스), 칸도
      # 1개면 충분하다 — 07:30 같은 순간에 화면 조회가 여러 건 겹치는 것은 드물다.
      mapRouteOnDemand:
        max-concurrent-calls: 1
        max-wait-duration: 0

app:
  # 장소 이름 검색(주소 자동완성의 보조 후보, 2026-09-23) — NAVER API HUB 지역 검색. 지도 API 와 다른 애플리케이션
  # 키라 따로 받는다(NCP 콘솔 → NAVER API HUB → Application). 키가 비면 호출이 401 로 실패하고 주소 후보만 나간다.
  place-search:
    provider: naver
    naver:
      base-url: https://naverapihub.apigw.ntruss.com
      key-id: ${NAVER_SEARCH_CLIENT_ID:}
      key: ${NAVER_SEARCH_CLIENT_SECRET:}
  # 노선 계산 ③단계의 외부 도로 경로 API(ARCHITECTURE §8.2). provider 가 구현체를 고른다 —
  # 기본값은 실 API(naver)이고, 테스트 전체 묶음은 build.gradle 이 stub 으로 넘겨 돈다(지오코딩과 같은
  # 이유 — 네트워크·요금·NCP 계정 상태가 판정을 바꾸면 그 초록은 코드에 대해 아무것도 말하지 않는다).
  routing:
    map:
      provider: naver
      # 공급자 제약이라 정책 상수가 아니다(§7 규칙 10 의 환경 인프라값) — Directions 15 는 1회 호출당
      # 경유지 15개 + start/goal = 총 17개다(BE-R1 목표 6, 2026-09-13 Directions 5 에서 전환).
      # RoutePointSegments.split() 은 경유지만이 아니라 총지점수를 센다.
      # ⚠ 대가 — 일일 할당량이 60,000(Directions 5) → 3,000(Directions 15) 으로 감소(2026-09-13 사용자
      # 실측). 노선당 호출은 절반으로 줄지만 할당량은 1/20 이라, 정차지 10개 노선 기준 일일 처리
      # 가능 노선이 30,000 → 3,000 으로 순감소.
      # 기각한 대안 — 옛 경로(map-direction/v1/driving) + 상한만 17. 옛 경로가 실측상 경유지 16개도
      # 받아 결과에 반영하지만(2026-09-13 실 API 호출 확인 — 상한 위반해도 200·경유지 반영값 응답)
      # 문서에 없는 동작이라 기각 — 네이버가 상한을 걸기 시작하면 경유지가 조용히 버려지고
      # 증상은 "경로가 이상하다" 로만 보인다.
      # 근거 — docs/archive/rounds/be-rounds-r1-r4.md §8.2 할당량 판정(2026-09-13 사용자 확정).
      # 넘으면 어댑터가 구간을 나눠 부르고 결과를 이어 붙인다.
      # Directions 15 한도가 바닥나면 둘을 짝으로 바꿔 Directions 5 로 돈다(Ruling 361) —
      # max-waypoints 7(경유지 5 + start/goal) · driving-path /map-direction/v1/driving.
      # 하나만 바꾸면 5 에 경유지 15개를 보내 문서 밖 동작에 기대게 된다(위 기각 사유와 같다).
      max-waypoints: ${NAVER_DIRECTIONS_MAX_POINTS:17}
      naver:
        # ⚠️ maps.apigw.ntruss.com 이다 — 구 호스트는 이 자격증명으로 401 을 낸다(지오코딩 주석 참조).
        base-url: https://maps.apigw.ntruss.com
        driving-path: ${NAVER_DIRECTIONS_PATH:/map-direction-15/v1/driving}
        # NCP 자격증명은 상품별이 아니라 애플리케이션 단위라 지오코딩과 같은 키를 쓴다.
        key-id: ${NAVER_MAPS_KEY_ID:${NAVER_DIRECTIONS_KEY_ID:}}
        key: ${NAVER_MAPS_KEY:${NAVER_DIRECTIONS_KEY:}}
  # 외부 내비게이션 앱 연동(§4.16 · RUN-08, Ruling 201). provider 가 구현체를 고르고, 요청 파라미터로는
  # 받지 않는다 — 공급자별 승하차지 상한(카카오 4)은 구현체 상수라 여기 두지 않는다(Ruling 204).
  navigation:
    provider: kakao
  # 학생 사진 저장(§5.11 · Ruling 159). storage 값이 PhotoStorage 구현체를 고른다 —
  # 운영 저장 위치(S3 등)는 아직 미정이라(오픈 이슈 W) 지금은 로컬 디스크 하나뿐이다.
  # 위치·주소 접두사만 여기 둔다. 5MB 상한과 이미지 3종은 사양이 정한 정책값이라 코드 상수다.
  photo:
    storage: local
    local:
      root: ${PHOTO_STORAGE_ROOT:./var/photos}
      url-prefix: /api/v1/files/photos
  # 첫 메인 관리자(system_admin) 1회 생성 — prod 는 계정이 0개이고 가입 신청 5종에 이 역할이 없어 배포해도 로그인할 사람이
  # 없다. 메인 관리자가 하나도 없을 때만 만들고 있으면 값은 무시된다(FirstSystemAdminBootstrap). 비밀번호는 평문이 아니라
  # bcrypt 해시다 — 평문이면 기동이 멈춘다. 값은 SSM 선택 항목(DEPLOYMENT.md §3·§4)이며 로그에 남기지 않는다.
  bootstrap-admin:
    login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
    password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  # STOMP(WebSocket) 허용 출처. REST 의 app.cors.allowed-origins 와 별개다 —
  # 스프링에서 WebSocket 핸드셰이크는 CORS 필터를 타지 않고 자체 origin 검사를 한다.
  # 이 기본값 `*` 은 로컬 전용이다. prod·demo·staging 절은 기본값 없이 요구한다 — EC2 운영은
  # docker-compose.prod.yml, 스테이징은 Cloudflare Tunnel 의 공개 주소(PUBLIC_URL)를 넣는다.
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS:*}
  # /api/** CORS 허용 출처 — 새 프론트엔드 프레임워크 개발 서버가 다른 포트에서 붙을 때 대비
  # (콤마로 구분된 문자열). 목록에 없는 포트를 쓰면 이 값에 추가하거나 CORS_ALLOWED_ORIGINS로 오버라이드.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081,http://127.0.0.1:3000,http://127.0.0.1:5173}

# JWT — 서명 키는 프로파일별로 주입한다.
# 여기에 기본값을 두지 않는 이유: 두면 prod 에서 JWT_SECRET 을 빠뜨려도 저장소에 공개된 키로
# 조용히 기동하고, 그 키로 아무 역할의 토큰이나 위조할 수 있다. 미주입 시 기동 실패가 맞다
# (ws.allowed-origin-patterns 와 같은 방침).
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 900        # 15분
  refresh-token-validity-seconds: 1209600   # 14일

springdoc:
  swagger-ui:
    tags-sorter: alpha   # 태그 이름 알파벳순 정렬 — 인증(AuthController)에 "0. " 접두사를 붙여 최상단 고정

server:
  tomcat:
    mbeanregistry:
      # Tomcat 스레드 풀 지표(tomcat.threads.*)는 MBean 레지스트리가 켜져 있어야
      # Micrometer 의 TomcatMetrics 가 읽을 수 있다. 기본값 false 라 켜지 않으면
      # tomcat_sessions_* 만 나오고 스레드 포화를 관측할 수 없다(설계 §6.1 스레드 패널).
      enabled: true

# 로그 줄마다 요청 추적 식별자(API_SPEC §1.3 X-Request-Id)를 싣는다 — RequestIdFilter 가 MDC 에 넣는다.
# 기본 패턴을 통째로 바꾸지 않고 수준(level) 자리만 넓힌다. 요청 밖(배치·WebSocket) 로그는 빈 괄호다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# 배포 검증·컨테이너 healthcheck(health)·Prometheus 스크레이프(prometheus) 전용. 상세는 감춘다 —
# 상세를 켜면 DB URL·Redis 호스트 같은 인프라 정보가 인증 없이 노출된다.
# 외부 접근은 nginx(infra/proxy/nginx.prod.conf)가 /actuator 를 404 로 막는다.
management:
  endpoints:
    web:
      exposure:
        # prometheus 를 더하지만 외부 도달은 여전히 불가하다 —
        # nginx(infra/proxy/nginx.prod.conf)가 /actuator 를 404 로 막고,
        # Prometheus 는 compose 내부 네트워크에서 backend:8080 으로 직접 스크레이프한다.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 지표에 붙는 공통 태그. 나중에 인스턴스가 늘면 여기서 구분한다.
      application: school-bus
    web:
      server:
        # management.metrics.web.server.max-uri-tags 기본값은 100(Boot 4.1 도 동일 경로,
        # spring-boot-micrometer-metrics 모듈 소속으로 확인). 이 저장소의 매핑 애너테이션이
        # 82개고 여기에 /actuator/health·/actuator/prometheus·swagger 경로·NOT_FOUND·
        # REDIRECTION 이 각각 별도 uri 태그값으로 더해져 기본 상한에 가깝다. 상한을 넘으면
        # 예외 없이 WARN 로그 한 줄만 남기고 새 uri 태그의 미터가 조용히 누락돼(엔드포인트가
        # API 대시보드에서 소리 없이 사라짐), 여유를 두고 150 으로 올린다.
        max-uri-tags: 150
    distribution:
      # 백분위수는 기본 비활성이다. 이 설정이 없으면 대시보드의 p95·p99 패널이 빈 값이 된다.
      percentiles-histogram:
        http.server.requests: true
      # 히스토그램 버킷 범위. 하한을 5ms 로 두는 이유는 대부분의 조회 API 가 그 아래로 내려가지 않아서고,
      # 상한 10s 는 외부 경로 API(네이버 Directions) 호출이 섞인 배차 API 를 담기 위해서다.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

---
# 로컬 개발 프로파일
spring:
  config:
    activate:
      on-profile: local
  flyway:
    # 스키마 + 데모 시드데이터(prod엔 적용 안 됨) + 데모 규모 시드(local 전용 — 테스트 JVM 은 build.gradle 이 뺀다)
    locations: classpath:db/migration,classpath:db/migration-local,classpath:db/migration-demo
    clean-disabled: false   # local 만 되살린다 — 재기동마다 LocalFlywayCleanStrategy 가 clean() 후 migrate() 한다(docs/IMPLEMENTATION_PLAN.md §3.2)
    placeholders:
      # BCryptPasswordEncoder(strength 10)로 사전 생성한 평문 "password" 의 해시.
      # 로컬 전용이라 파일에 박아둔다 — demo·prod 는 절대 이 값을 쓰지 않는다.
      seedPasswordHash: "$2a$10$Noeszx0nzJUfNo4ubCD03eNfMVfMD9feMo04y/8DHiFLUBF.JZ/Fq"
# 로컬 전용 개발 키 — 이 값은 저장소에 공개돼 있으므로 로컬 밖에서 쓰지 않는다.
jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-minimum-length}

---
# 운영 프로파일 (비밀값은 모두 환경변수)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 부하 측정(2026-09-09 §13.5)이 정한 값(BR-168) — 측정 기계(10코어)에서 정한 잠정값이다.
      # 운영 권장 사양(4 vCPU)에서 재측정 전까지 이 값을 쓴다(Ruling 351). 백엔드는 인스턴스
      # 1대뿐이라(위 backend 서비스 주석 — replicas 금지) 20 + 운영자 접속 여유로 postgres
      # max_connections 기본값 100(docker-compose.prod.yml 이 별도 지정 안 함)을 넘지 않는다.
      maximum-pool-size: 20
      # 3초 — 기본 30초는 풀이 찼을 때 요청 스레드가 연결을 30초씩 기다리며 쌓인다(2026-09-09 붕괴 형태, R46 D #17).
      # 빨리 실패하면 요청은 다음 시도에서 회복하고, 알림 발송·확정 배치는 pending 행이 남아 다음 주기에 다시 집힌다.
      # max-lifetime 은 기본 30분이 맞아 그대로 둔다 — postgres·프록시의 유휴 연결 제한이 그보다 길다.
      connection-timeout: 3000
      # 연결을 5초 넘게 쥔 스레드의 스택을 로그에 남긴다(R46 T-7) — 풀이 마르면 누가 쥐었는지 특정하고, 이후 코드가 외부 호출을
      # 트랜잭션 안에 되돌려 놓는 회귀도 이 로그로 드러난다. 5초인 이유는 staging 과 같다(정상 요청은 수십 ms · 가장 긴 읽기도 1초 안).
      leak-detection-threshold: 5000
      data-source-properties:
        # DB 세션 시간 상한(R46 S-4) — 연결 3초 대기(connection-timeout)는 "연결을 얻는 대기"만 자르고 잠금 대기·쥔 시간은 못 자른다.
        # lock_timeout 5초: 행 잠금을 5초 넘게 기다리면 DB 가 포기한다(정상 대기는 수 ms) → 503.
        # idle_in_transaction_session_timeout 30초: 트랜잭션을 연 채 문장 사이에 30초 쉰 세션을 DB 가 끊는다(앱 쪽 대기는 1초 안).
        # statement_timeout 은 걸지 않는다 — 보존 정리 DELETE(5,000행)·Flyway 마이그레이션이 같은 계정이다.
        # JDBC URL 옵션 대신 여기 둔 이유: 운영 compose 가 DB_URL 을 통째로 넘겨 URL 에 붙일 자리가 없다(드라이버 연결 속성으로 같은 효과).
        options: -c lock_timeout=5000 -c idle_in_transaction_session_timeout=30000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  flyway:
    clean-disabled: true   # 공통 섹션과 같은 값이나, 배포 설정은 상속보다 한눈에 보이는 편을 우선한다(demo 섹션과 동일 방침)
server:
  tomcat:
    threads:
      # 요청 스레드 = DB 연결 풀(20)의 5배(R46-LATERBE L11, Ruling 674) — 명시하지 않으면 기본 200 이라 풀이 마를 때 200개 스레드가 연결을
      # 3초씩 기다리며 서 있다(부하 측정: 풀 10 에서 tomcatBusy 200 · hikariPend 116~194). 풀의 4~5배면 DB 를 안 쓰는 요청(Redis 읽기·헬스)이
      # 연결 대기에 막히지 않을 여유가 남고, 대기 스레드는 80개로 한정된다. STOMP 수신·발신은 별도 실행기라 이 스레드를 쓰지 않는다.
      max: 100
    # 스레드가 다 찬 뒤 TCP 대기열 — 기본값(100)과 같다. 더 키우면 거절 대신 오래 기다리다 3초 뒤 5xx 가 되는 요청이 늘 뿐이다.
    accept-count: 100

# 운영은 localhost 개발 출처를 신뢰하면 안 되므로 기본값 없이 환경변수로만 명시 주입(미설정 시 빈 목록 = 전부 차단)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # ⚠️ 기본값을 두지 않는다. 이 키를 빼면 공통 섹션의 `${WS_ALLOWED_ORIGIN_PATTERNS:*}` 를
  #    그대로 상속해 **모든 출처에서 WebSocket 이 허용된다.** REST 와 달리 핸드셰이크는
  #    CORS 필터를 타지 않아 이 값이 유일한 방어선이다. 미주입 시 기동 실패가 맞다.
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS}
    outbound:
      # 부하 측정(§13.5)이 정한 값(BR-168) — 위 hikari 주석과 같은 잠정값 근거(Ruling 351).
      core-pool-size: 32
  # 실 푸시는 FCM 한 채널(Ruling 331). ⚠️ 자격 증명 3개는 기본값을 두지 않는다 — 빠지면 기동 실패가 맞다.
  #    로그 전용 구현(LoggingPushSender)은 prod 에서 스스로 기동을 막는다.
  push:
    sender: fcm
    fcm:
      project-id: ${FCM_PROJECT_ID}
      client-email: ${FCM_CLIENT_EMAIL}
      private-key: ${FCM_PRIVATE_KEY}

---
# 데모 배포 프로파일 — prod 를 기준으로 데모 시드 로드를 더한 것이다.
# prod 는 시드가 없어 계정이 0개인데, PLATFORM_ADMIN·ACADEMY_ADMIN 은
# API 로 만들 수 없다(AuthCommandService 가 403, MemberController 도 거부).
# 즉 시드 없이 배포하면 **아무도 로그인할 수 없다** — prod 는 첫 메인 관리자를 BOOTSTRAP_ADMIN_* 로 1회 만든다
# (app.bootstrap-admin · FirstSystemAdminBootstrap). demo 는 시드가 그 자리를 채운다.
#
# prod 의 datasource·redis 블록을 상속하지 않고 다시 적는다. spring.profiles.group 으로
# 묶으면 줄은 줄지만 "지금 어떤 값이 쓰이는지"를 이 파일만 봐서 알 수 없게 된다 —
# 배포 설정은 영리함보다 한눈에 보이는 편이 낫다.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # prod 섹션과 같은 근거(BR-168, Ruling 351) — demo 도 인스턴스 1대라 같은 계산이 그대로 적용된다.
      maximum-pool-size: 20
      connection-timeout: 3000   # prod 섹션과 같은 근거(R46 D #17)
      leak-detection-threshold: 5000   # prod 섹션과 같은 근거(R46 T-7)
      data-source-properties:
        options: -c lock_timeout=5000 -c idle_in_transaction_session_timeout=30000   # prod 섹션과 같은 근거(R46 S-4)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local
    clean-disabled: true   # demo 는 시드를 적재하되 clean() 은 여전히 금지 — 운영과 같은 볼륨 영속 DB 다
    placeholders:
      # ⚠️ 기본값을 두지 않는다. 기본값을 두면 주입을 깜빡했을 때 조용히 "password" 로 떠서
      #    공개 도메인에 PLATFORM_ADMIN 계정이 열린 채 배포된다. 미주입 시 기동 실패가 맞다.
      seedPasswordHash: ${SEED_PASSWORD_HASH}

server:
  tomcat:
    threads:
      max: 100   # prod 섹션과 같은 근거(풀 20 의 5배 — R46-LATERBE L11, Ruling 674)
    accept-count: 100

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS}
    outbound:
      core-pool-size: 32   # prod 섹션과 같은 근거(BR-168, Ruling 351)

---
# 스테이징(팀원 체험용 서버) — `local,staging` 두 프로파일을 함께 켠다(docker-compose.staging.yml).
# local 의 데모 시드·버스 시뮬레이터(DemoRunSimulator)는 그대로 쓰고, 공개 주소에 올라가면 위험해지는
# local 값만 덮는다. ⚠️ 이 섹션은 local 섹션보다 **뒤**에 있어야 이긴다(한 파일의 프로파일 문서는 뒤가 이긴다).
# ⚠️ 전부 기본값을 두지 않는다 — 빠뜨리면 저장소에 공개된 값으로 조용히 뜨는 대신 기동 실패가 맞다.
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    hikari:
      # 풀은 local 과 같은 기본 10 그대로다. 타임아웃은 prod 섹션과 같은 근거(R46 D #17).
      connection-timeout: 3000
      # 연결을 5초 넘게 쥔 스레드의 스택을 로그에 남긴다 — 팀원 체험 중 풀이 마르면 누가 쥐었는지 이 로그로 특정한다.
      # 5초인 이유 — 정상 요청은 연결을 수십 ms 만 쥐고 가장 긴 읽기(Redis 500ms 상한 포함)도 1초 안이라 오탐이 없다.
      leak-detection-threshold: 5000
  flyway:
    placeholders:
      # local 의 평문 "password" 해시는 공개 저장소에 있다 — 시드 계정 전부가 이 값으로 바뀐다.
      seedPasswordHash: ${SEED_PASSWORD_HASH}
server:
  tomcat:
    threads:
      max: 50   # 풀(기본 10)의 5배 — prod 섹션과 같은 근거(R46-LATERBE L11, Ruling 674). 팀원 체험 서버라 50 으로 충분하다
    accept-count: 100
jwt:
  # local 기본 키는 공개돼 있어 그대로 두면 아무 역할의 토큰이나 위조할 수 있다.
  secret: ${JWT_SECRET}
app:
  # 테스트 데이터 초기화(POST /dev/reset · 웹 머리말 버튼 · 백엔드 재시작)가 실제로 DB 를 비우게 한다(Ruling 364).
  # LocalFlywayCleanStrategy 는 localhost 만 clean() 을 허용하는데 compose 안의 DB 는 컨테이너 이름 `postgres` 로
  # 불린다 — 그 이름 하나만 더 연다. 부를 수 있는 것은 승인된(active) 계정뿐이다(대기 계정은 상태 게이트가 403).
  flyway-clean:
    extra-allowed-hosts: postgres
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS}
