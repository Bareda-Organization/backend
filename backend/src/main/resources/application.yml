spring:
  application:
    name: backend
  profiles:
    active: local

  # API_SPEC 의 모든 필드가 snake_case 다(Ruling 104) — DTO 마다 @JsonProperty 를 손으로 붙이는 대신
  # 전역 네이밍 전략으로 고정한다. camelCase 자바 필드명을 자동 변환하므로, 새 DTO 를 추가할 때도
  # 이 규칙만 지키면 애너테이션 없이 API_SPEC 과 맞는다.
  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      # 학생 사진 업로드(§5.11)가 이 저장소의 유일한 멀티파트다. 기본값이 1MB 라 그대로 두면
      # 사양이 허용하는 5MB 사진이 톰캣에서 먼저 끊긴다.
      #
      # ⚠ 여기 값은 정책이 아니라 컨테이너 방어선이다 — 사양 상한 5MB 는 StudentPhoto 의 코드
      # 상수이고(횡단 규칙 10), 이 값은 그보다 위에 둬야 5~8MB 요청이 톰캣이 아니라 사양 검증에
      # 닿아 422 VALIDATION_FAILED 로 거부된다. 아래로 내리면 상한이 조용히 이 파일 값으로 바뀐다.
      max-file-size: 8MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://localhost:5432/schoolbus
    username: schoolbus
    password: schoolbus

  jpa:
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway(db/migration)가 관리 — Hibernate는 엔티티↔실제 스키마 일치만 검증
    open-in-view: false          # 실무 표준: 영속성 컨텍스트를 뷰까지 끌고 가지 않음
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration   # 스키마 마이그레이션(전 프로파일 공통). local·demo 프로파일은 시드 데이터 위치를 추가로 더한다.
    # Flyway 10+ 기본값도 true 이나, Spring 계층(전략 빈)이 전부 뚫려도 라이브러리 자체가
    # clean() 을 거부하도록 명시로 고정한다 — local 블록만 false 로 되돌린다(docs/IMPLEMENTATION_PLAN.md §3.2 겹4).
    clean-disabled: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:29092   # docker-compose kafka 서비스의 호스트용 PLAINTEXT_HOST 리스너
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: school-bus-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "src.backend.*"

# 주소 → 좌표 변환 (C-18 네이버 확정, Ruling 157). stub 으로 바꾸면 결정론적 스텁이 뜬다 —
# 테스트 전체 묶음은 build.gradle 이 이 값을 stub 으로 넘겨 돈다(네트워크·요금·NCP 계정 상태가
# 판정을 바꾸면 그 초록은 코드에 대해 아무것도 말하지 않는다).
geocoding:
  provider: naver
  naver:
    # ⚠️ maps.apigw.ntruss.com 이다. 구 호스트 naveropenapi.apigw.ntruss.com 은 이 자격증명으로
    #    401 Permission Denied(errorCode 210)를 낸다 — 2026-08-26 실측.
    base-url: https://maps.apigw.ntruss.com
    # 새 이름을 우선하되 기존 NAVER_DIRECTIONS_* 로 폴백한다. NCP 자격증명은 상품별이 아니라
    # 애플리케이션 단위라 그 키가 Geocoding 에도 그대로 통하며, .env 를 고치지 않아도 되게 한다.
    # 이름이 사실과 어긋나 있으나(그 키는 Directions 전용이 아니다) 개명은 .env·docker-compose.prod.yml·
    # DEPLOYMENT.md 를 함께 건드리는 별도 단위다.
    key-id: ${NAVER_MAPS_KEY_ID:${NAVER_DIRECTIONS_KEY_ID:}}
    key: ${NAVER_MAPS_KEY:${NAVER_DIRECTIONS_KEY:}}

# 외부 지도 API 보호(횡단 규칙 11) — 보호를 호출자가 아니라 어댑터 설정에 둔다.
# 이것이 없으면 네이버 장애가 곧 주소 저장 불가가 된다.
resilience4j:
  retry:
    instances:
      geocoding:
        max-attempts: 3
        wait-duration: 200ms
        # 서킷이 이미 열려 호출을 막은 것은 재시도 대상이 아니다 — 재시도해 봐야 열린 서킷을
        # 세 번 두드리고 wait-duration 만큼 응답이 늦어질 뿐 공급자에는 닿지 않는다.
        #
        # 여기에 GeocodingUnavailableException 을 적으면 안 된다. 그것은 fallbackMethod 가 만드는
        # 포트 예외라, 적는 순간 "일시 실패를 재시도한다"는 이 설정 자체가 무력화된다.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      # 지도 경로도 같은 이유로 재시도를 둔다. wait-duration 이 지오코딩보다 짧은 것은 이쪽 호출자가
      # 승인 화면에서 대기 중일 수 있기 때문이다 — 주입한 타임아웃은 1회 요청의 상한이라, 재시도가
      # 붙으면 관리자가 실제로 기다리는 시간은 그 배수가 된다(ARCHITECTURE §8.3).
      mapRoute:
        max-attempts: 3
        wait-duration: 100ms
        # 서킷 개방과 격벽 거부는 둘 다 "공급자에 닿지도 못한 것" 이라 재시도 대상이 아니다.
        # 재시도해 봐야 닫힌 문을 세 번 두드리고 wait-duration 만큼 응답만 늦어진다.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  circuitbreaker:
    instances:
      geocoding:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # 최소 표본을 두지 않으면 첫 호출 한 번이 실패했을 때 실패율 100%로 서킷이 즉시 열린다.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      # 지오코딩과 값이 같으나 인스턴스를 가른다 — 네이버 Geocoding 이 죽었다고 Directions 호출까지
      # 막으면 주소 하나 때문에 노선 계산 전체가 근사값으로 떨어진다. 둘은 서로 다른 상품이다.
      mapRoute:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 격벽이 거부한 호출은 공급자 장애가 아니다 — 공급자는 멀쩡한데 우리가 스스로 막은 것이다.
        # 집계에 넣으면 동시 도래가 한 번 몰린 것만으로 실패율이 임계를 넘어 서킷이 열리고,
        # 그 순간부터 온디맨드가 503 을 받는다. 자기 보호 장치가 서로를 넘어뜨리는 형태다.
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  # 동시 호출 수 제한(TECH_DECISIONS §8 · ARCHITECTURE §9.4) — 동시 도래가 몰려도 공급자
  # 레이트리밋을 넘지 않게 한다. 서킷·재시도가 "공급자가 이미 아플 때" 를 다룬다면 격벽은
  # "우리가 공급자를 아프게 만드는 것" 을 막는다.
  bulkhead:
    instances:
      mapRoute:
        # ⚠ NCP 가 공개한 레이트리밋을 실측하지 못해 보수적으로 잡은 잠정값이다(2026-08-29).
        # 공급자 제약이라 정책 상수가 아니라 환경 인프라값이고, 실측되면 이 값만 고친다.
        max-concurrent-calls: 4
        # 0 = 대기 없이 즉시 거부. 대기를 두면 호출자가 주입한 타임아웃 예산 밖의 시간이 앞에
        # 붙어, 관리자가 승인 화면에서 얼마를 기다릴지를 이 yml 값이 정하게 된다 —
        # ARCHITECTURE §8.3 이 타임아웃을 호출자 주입으로 정한 이유와 정면으로 어긋난다.
        # 거부의 결과는 이미 정의된 경로(단발 실패 → 직선거리 근사)로 흡수된다.
        max-wait-duration: 0

app:
  # 노선 계산 ③단계의 외부 도로 경로 API(ARCHITECTURE §8.2). provider 가 구현체를 고른다 —
  # 기본값은 실 API(naver)이고, 테스트 전체 묶음은 build.gradle 이 stub 으로 넘겨 돈다(지오코딩과 같은
  # 이유 — 네트워크·요금·NCP 계정 상태가 판정을 바꾸면 그 초록은 코드에 대해 아무것도 말하지 않는다).
  routing:
    map:
      provider: naver
      # 공급자 제약이라 정책 상수가 아니다(§7 규칙 10 의 환경 인프라값) — NCP Direction 은 1회 호출당
      # 경유지 5개 + start/goal = 총 7개다. 넘으면 어댑터가 구간을 나눠 부르고 결과를 이어 붙인다.
      max-waypoints: 7
      naver:
        # ⚠️ maps.apigw.ntruss.com 이다 — 구 호스트는 이 자격증명으로 401 을 낸다(지오코딩 주석 참조).
        base-url: https://maps.apigw.ntruss.com
        # NCP 자격증명은 상품별이 아니라 애플리케이션 단위라 지오코딩과 같은 키를 쓴다.
        key-id: ${NAVER_MAPS_KEY_ID:${NAVER_DIRECTIONS_KEY_ID:}}
        key: ${NAVER_MAPS_KEY:${NAVER_DIRECTIONS_KEY:}}
  # 학생 사진 저장(§5.11 · Ruling 159). storage 값이 PhotoStorage 구현체를 고른다 —
  # 운영 저장 위치(S3 등)는 아직 미정이라(오픈 이슈 W) 지금은 로컬 디스크 하나뿐이다.
  # 위치·주소 접두사만 여기 둔다. 5MB 상한과 이미지 3종은 사양이 정한 정책값이라 코드 상수다.
  photo:
    storage: local
    local:
      root: ${PHOTO_STORAGE_ROOT:./var/photos}
      url-prefix: /files/photos
  # STOMP(WebSocket) 허용 출처. REST 의 app.cors.allowed-origins 와 별개다 —
  # 스프링에서 WebSocket 핸드셰이크는 CORS 필터를 타지 않고 자체 origin 검사를 한다.
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS:*}
  # /api/** CORS 허용 출처 — 새 프론트엔드 프레임워크 개발 서버가 다른 포트에서 붙을 때 대비
  # (콤마로 구분된 문자열). 목록에 없는 포트를 쓰면 이 값에 추가하거나 CORS_ALLOWED_ORIGINS로 오버라이드.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081,http://127.0.0.1:3000,http://127.0.0.1:5173}

# JWT — 서명 키는 프로파일별로 주입한다.
# 여기에 기본값을 두지 않는 이유: 두면 prod 에서 JWT_SECRET 을 빠뜨려도 저장소에 공개된 키로
# 조용히 기동하고, 그 키로 아무 역할의 토큰이나 위조할 수 있다. 미주입 시 기동 실패가 맞다
# (ws.allowed-origin-patterns 와 같은 방침).
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 900        # 15분
  refresh-token-validity-seconds: 1209600   # 14일

springdoc:
  swagger-ui:
    tags-sorter: alpha   # 태그 이름 알파벳순 정렬 — 인증(AuthController)에 "0. " 접두사를 붙여 최상단 고정

server:
  tomcat:
    mbeanregistry:
      # Tomcat 스레드 풀 지표(tomcat.threads.*)는 MBean 레지스트리가 켜져 있어야
      # Micrometer 의 TomcatMetrics 가 읽을 수 있다. 기본값 false 라 켜지 않으면
      # tomcat_sessions_* 만 나오고 스레드 포화를 관측할 수 없다(설계 §6.1 스레드 패널).
      enabled: true

# 배포 검증·컨테이너 healthcheck(health)·Prometheus 스크레이프(prometheus) 전용. 상세는 감춘다 —
# 상세를 켜면 DB URL·Redis 호스트 같은 인프라 정보가 인증 없이 노출된다.
# 외부 접근은 nginx(infra/proxy/nginx.prod.conf)가 /actuator 를 404 로 막는다.
management:
  endpoints:
    web:
      exposure:
        # prometheus 를 더하지만 외부 도달은 여전히 불가하다 —
        # nginx(infra/proxy/nginx.prod.conf)가 /actuator 를 404 로 막고,
        # Prometheus 는 compose 내부 네트워크에서 backend:8080 으로 직접 스크레이프한다.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 지표에 붙는 공통 태그. 나중에 인스턴스가 늘면 여기서 구분한다.
      application: school-bus
    web:
      server:
        # management.metrics.web.server.max-uri-tags 기본값은 100(Boot 4.1 도 동일 경로,
        # spring-boot-micrometer-metrics 모듈 소속으로 확인). 이 저장소의 매핑 애너테이션이
        # 82개고 여기에 /actuator/health·/actuator/prometheus·swagger 경로·NOT_FOUND·
        # REDIRECTION 이 각각 별도 uri 태그값으로 더해져 기본 상한에 가깝다. 상한을 넘으면
        # 예외 없이 WARN 로그 한 줄만 남기고 새 uri 태그의 미터가 조용히 누락돼(엔드포인트가
        # API 대시보드에서 소리 없이 사라짐), 여유를 두고 150 으로 올린다.
        max-uri-tags: 150
    distribution:
      # 백분위수는 기본 비활성이다. 이 설정이 없으면 대시보드의 p95·p99 패널이 빈 값이 된다.
      percentiles-histogram:
        http.server.requests: true
      # 히스토그램 버킷 범위. 하한을 5ms 로 두는 이유는 대부분의 조회 API 가 그 아래로 내려가지 않아서고,
      # 상한 10s 는 외부 경로 API(OSRM·네이버 Directions) 호출이 섞인 배차 API 를 담기 위해서다.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

---
# 로컬 개발 프로파일
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local   # 스키마 + 데모 시드데이터(prod엔 적용 안 됨)
    clean-disabled: false   # local 만 되살린다 — 재기동마다 LocalFlywayCleanStrategy 가 clean() 후 migrate() 한다(docs/IMPLEMENTATION_PLAN.md §3.2)
    placeholders:
      # BCryptPasswordEncoder(strength 10)로 사전 생성한 평문 "password" 의 해시.
      # 로컬 전용이라 파일에 박아둔다 — demo·prod 는 절대 이 값을 쓰지 않는다.
      seedPasswordHash: "$2a$10$Noeszx0nzJUfNo4ubCD03eNfMVfMD9feMo04y/8DHiFLUBF.JZ/Fq"
# 로컬 전용 개발 키 — 이 값은 저장소에 공개돼 있으므로 로컬 밖에서 쓰지 않는다.
jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-minimum-length}

---
# 운영 프로파일 (비밀값은 모두 환경변수)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  flyway:
    clean-disabled: true   # 공통 섹션과 같은 값이나, 배포 설정은 상속보다 한눈에 보이는 편을 우선한다(demo 섹션과 동일 방침)

# 운영은 localhost 개발 출처를 신뢰하면 안 되므로 기본값 없이 환경변수로만 명시 주입(미설정 시 빈 목록 = 전부 차단)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # ⚠️ 기본값을 두지 않는다. 이 키를 빼면 공통 섹션의 `${WS_ALLOWED_ORIGIN_PATTERNS:*}` 를
  #    그대로 상속해 **모든 출처에서 WebSocket 이 허용된다.** REST 와 달리 핸드셰이크는
  #    CORS 필터를 타지 않아 이 값이 유일한 방어선이다. 미주입 시 기동 실패가 맞다.
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS}

---
# 데모 배포 프로파일 — prod 를 기준으로 데모 시드 로드를 더한 것이다.
# prod 는 시드가 없어 계정이 0개인데, PLATFORM_ADMIN·ACADEMY_ADMIN 은
# API 로 만들 수 없다(AuthCommandService 가 403, MemberController 도 거부).
# 즉 시드 없이 배포하면 **아무도 로그인할 수 없다.**
#
# prod 의 datasource·redis·kafka 블록을 상속하지 않고 다시 적는다. spring.profiles.group 으로
# 묶으면 줄은 줄지만 "지금 어떤 값이 쓰이는지"를 이 파일만 봐서 알 수 없게 된다 —
# 배포 설정은 영리함보다 한눈에 보이는 편이 낫다.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local
    clean-disabled: true   # demo 는 시드를 적재하되 clean() 은 여전히 금지 — 운영과 같은 볼륨 영속 DB 다
    placeholders:
      # ⚠️ 기본값을 두지 않는다. 기본값을 두면 주입을 깜빡했을 때 조용히 "password" 로 떠서
      #    공개 도메인에 PLATFORM_ADMIN 계정이 열린 채 배포된다. 미주입 시 기동 실패가 맞다.
      seedPasswordHash: ${SEED_PASSWORD_HASH}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS}
