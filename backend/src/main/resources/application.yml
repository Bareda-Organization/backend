spring:
  application:
    name: backend
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/schoolbus
    username: schoolbus
    password: schoolbus

  jpa:
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway(db/migration)가 관리 — Hibernate는 엔티티↔실제 스키마 일치만 검증
    open-in-view: false          # 실무 표준: 영속성 컨텍스트를 뷰까지 끌고 가지 않음
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration   # 스키마 마이그레이션(전 프로파일 공통). local 프로파일은 시드 데이터 위치를 추가로 더한다.

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:29092   # docker-compose kafka 서비스의 호스트용 PLAINTEXT_HOST 리스너
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: school-bus-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "src.backend.*"

# 외부 경로 API (기본: 네이버 Directions — G6 실키 검증 후 전환. osrm 으로 바꾸면 무료 OSRM 대체)
routing:
  provider: naver
  osrm:
    base-url: https://router.project-osrm.org
  naver:
    key-id: ${NAVER_DIRECTIONS_KEY_ID:}
    key: ${NAVER_DIRECTIONS_KEY:}
  max-waypoints: 7   # NCP Direction 15 실측: mid-waypoints 최대 5개 + start/goal = 총 7개(초과 시 구간 분할)

# 실시간 위치 추적 · SOS 에스컬레이션 점검 주기
app:
  location:
    tick-ms: 3000          # 위치 소스 tick 주기(ms)
    mock:
      enabled: true        # Mock GPS 시뮬레이터 (실 GPS 전환 시 false)
      step: 0.08           # 매 tick 당 진행도 증가폭(0~1 삼각파)
    gps:
      enabled: false       # 실 학생폰 GPS push 소스 (실 연동 시 true)
    bus-mock:
      enabled: true        # 버스 단위 Mock GPS 시뮬레이터(F1) — 실 기사 GPS 전환 시 false
    bus-gps:
      enabled: false       # 실 기사 단말 GPS push 소스(F1) — 실 연동 시 true
  sos:
    escalation-check-ms: 30000   # OPEN 상태 SOS 를 다시 훑는 주기(ms). 임계값 자체는 NotificationThresholds.SOS_ESCALATION(3분)
  connection:
    heartbeat-ms: 10000          # STOMP 클라이언트-서버 ping/pong 간격(ms)
    loss-grace-seconds: 30       # heartbeat 끊김 후 이 시간(초)이 지나야 CONNECTION_LOST 로 확정(오탐 방지)
    loss-check-ms: 10000         # 끊김 후보를 다시 훑는 스케줄러 주기(ms)
  drivesession:
    approach-check-ms: 15000     # 진행 중 등원 세션의 APPROACH/NO_SHOW 후보를 다시 훑는 주기(ms). 임계값은 NotificationThresholds.APPROACH(5분)/NO_SHOW(10분)
  # /api/** CORS 허용 출처 — 새 프론트엔드 프레임워크 개발 서버가 다른 포트에서 붙을 때 대비
  # (콤마로 구분된 문자열). 목록에 없는 포트를 쓰면 이 값에 추가하거나 CORS_ALLOWED_ORIGINS로 오버라이드.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081,http://127.0.0.1:3000,http://127.0.0.1:5173}

# JWT (운영에서는 반드시 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-minimum-length}
  access-token-validity-seconds: 900        # 15분
  refresh-token-validity-seconds: 1209600   # 14일

springdoc:
  swagger-ui:
    tags-sorter: alpha   # 태그 이름 알파벳순 정렬 — 인증(AuthController)에 "0. " 접두사를 붙여 최상단 고정

# 배포 검증·컨테이너 healthcheck 전용. health 하나만 노출하고 상세는 감춘다 —
# 상세를 켜면 DB URL·Redis 호스트 같은 인프라 정보가 인증 없이 노출된다.
# 외부 접근은 nginx(infra/proxy/nginx.prod.conf)가 /actuator 를 404 로 막는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# 로컬 개발 프로파일
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local   # 스키마 + 데모 시드데이터(prod엔 적용 안 됨)
    placeholders:
      # BCryptPasswordEncoder(strength 10)로 사전 생성한 평문 "password" 의 해시.
      # 로컬 전용이라 파일에 박아둔다 — demo·prod 는 절대 이 값을 쓰지 않는다.
      seedPasswordHash: "$2a$10$Noeszx0nzJUfNo4ubCD03eNfMVfMD9feMo04y/8DHiFLUBF.JZ/Fq"

---
# 운영 프로파일 (비밀값은 모두 환경변수)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

# 운영은 localhost 개발 출처를 신뢰하면 안 되므로 기본값 없이 환경변수로만 명시 주입(미설정 시 빈 목록 = 전부 차단)
# + Mock 을 끄고 실 학생폰 GPS(push) 로 전환
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  location:
    mock:
      enabled: false
    gps:
      enabled: true
    bus-mock:
      enabled: false
    bus-gps:
      enabled: true
