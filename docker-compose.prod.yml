# 운영(데모) 배포용 compose — EC2 1대에 백엔드 + 인프라 전부를 올린다.
#
# 실행:
#   docker compose -f docker-compose.prod.yml --env-file /opt/school-bus/.env up -d
#
# 로컬용 docker-compose.yml 과 의도적으로 분리했다. 로컬 파일은 "매번 시드 상태로 리셋"이
# 목적이라 볼륨이 없고 DB·Redis 포트를 호스트에 열어두는데, 둘 다 운영에서는 정반대다.
#
# ── 로컬 파일과 달라지는 지점 ──
#   1. postgres 에 named volume 을 붙인다 (재시작해도 데이터 유지)
#   2. DB·Redis 포트를 호스트에 열지 않는다 (컨테이너 네트워크 안에서만 접근)
#   3. backend 를 빌드하지 않고 ECR 이미지를 pull 한다 (EC2 에서 Gradle 빌드는 메모리 부족)
#   4. 화면 서비스가 없다 — 이 저장소는 백엔드 API 전용이다
#   5. proxy 가 443(TLS)을 종단하고, certbot 이 인증서를 자동 갱신한다
#   6. 관측 스택(prometheus · alertmanager · grafana · node-exporter)이 함께 뜬다 — 호스트에는 Prometheus·Grafana 의
#      loopback 포트만 연다(인터넷에서 닿지 않는다). 접근은 docs/backend/infra/DEPLOYMENT.md §11
#
# ⚠️ 필요한 환경변수는 infra/scripts/deploy.sh 가 SSM Parameter Store 에서 읽어
#    /opt/school-bus/.env 로 생성한다. 이 파일에는 비밀값을 절대 적지 않는다.

# 모든 컨테이너 로그를 CloudWatch 로 보낸다 — EC2 가 죽어도 로그는 남는다.
# CloudWatch 를 안 쓰려면 이 앵커를 지우고 각 서비스의 `logging: *cloudwatch` 줄을 빼면 된다.
# ⚠ `mode: non-blocking` — 기본값(blocking)이면 CloudWatch 전송이 느려지는 순간 컨테이너의 stdout 쓰기가 막혀 로그를 남기는 모든 스레드가 같이 멈춘다
#   (Redis 장애 때 스택트레이스가 초당 수십 줄 나오는 상황이 원인이 된다 — review-stab S-3). 대신 버퍼(max-buffer-size)가 차면 로그를 버린다.
#   키 이름은 `mode`·`max-buffer-size` 다 — `awslogs-mode` 는 없는 옵션이라 `docker create` 가 거부한다(2026-10-01 실측).
x-logging: &cloudwatch
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-northeast-2}
    awslogs-group: /school-bus/demo
    awslogs-create-group: "true"
    mode: non-blocking
    max-buffer-size: 25m

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      # 비밀번호는 .env 를 통해서만 들어온다. 기본값을 두지 않아 미주입 시 기동이 실패하게 한다 —
      # 조용히 약한 기본값으로 뜨는 것보다 못 뜨는 편이 안전하다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 미설정}
      # DB 기본 정렬을 ICU 한국어로 — 이름순 목록이 가나다순 · 숫자는 크기순(`Ruling 851`·`852` · 개발 compose 와 같은 값). 빈 데이터 디렉터리를 처음 만들 때만 먹는다.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ko-KR-u-kn"
    # 쿼리별 실행 통계(pg_stat_statements)와 SSD 에 맞춘 임의 읽기 비용(gp3 — 기본값 4 는 HDD 기준이라 플래너가 인덱스 스캔을 덜 고른다).
    # 확장 생성은 초기화 스크립트가 한다(아래 마운트) — 이 옵션과 짝이다. 이미 초기화된 볼륨에는 스크립트가 돌지 않으니 절차서 §11.5 의 한 줄을 손으로 친다.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "random_page_cost=1.1"]
    volumes:
      # postgres 18 부터 공식 이미지가 데이터를 /var/lib/postgresql/18/docker 에 둔다(VOLUME 도 /var/lib/postgresql). 옛 위치
      # /var/lib/postgresql/data 에 마운트하면 컨테이너가 시작하지 않는다(Ruling 729). 주 버전을 올릴 때는 docs/backend/infra/DEPLOYMENT.md §7.4 절차를 따른다.
      - postgres-data:/var/lib/postgresql
      # 빈 데이터 디렉터리로 처음 뜰 때 한 번만 실행된다(공식 이미지 규칙).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # 호스트에 포트를 열지 않는다. DB 접속이 필요하면 SSM Session Manager 로 EC2 에 들어가
    # `docker compose -f docker-compose.prod.yml exec postgres psql -U schoolbus` 를 쓴다.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *cloudwatch

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    # 위치 캐시(TTL 9초) 전용이라 영속화가 불필요하다 — 유실돼도 다음 tick 에 복구된다.
    # 대신 메모리 상한을 걸어 Spring 의 몫을 침범하지 않게 한다.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *cloudwatch

  backend:
    # EC2 에서 빌드하지 않는다 — Gradle(Java 25) 빌드가 2GB 안팎을 먹어 실행 중인
    # 컨테이너들과 경합하면 OOM 이 난다. GitHub Actions 가 빌드해 ECR 에 올린 걸 받아 쓴다.
    image: ${ECR_REGISTRY:?ECR_REGISTRY 미설정}/school-bus-backend:${IMAGE_TAG:?IMAGE_TAG 미설정}
    restart: unless-stopped
    # 컨테이너 자체의 메모리 상한(FIX-VERIFY.md §5-4) — 없으면 JAVA_TOOL_OPTIONS 의
    # MaxRAMPercentage=70 이 호스트 전체 메모리(t3.medium 4GB, DEPLOYMENT.md §2.4) 기준으로
    # 계산돼 postgres·redis·proxy 몫까지 잠식한다. 3GB 로 두면 힙 상한은 약 2.15GB —
    # 부하 측정(FIX-VERIFY.md §3, 목표 대비 1.3~1.7배 부하에서 힙 최대 1.6~1.9GB)보다 여유가
    # 있고, 나머지 1GB 는 postgres(~250MB)·redis(maxmemory 128MB)·proxy(nginx, ~50MB)·OS 몫이다.
    mem_limit: 3072m
    # 종료 신호(SIGTERM) 뒤 SIGKILL 까지 기다리는 시간 — Docker 기본은 10초다. 스프링은 종료 신호를 받으면 새 요청을 막고 진행 중인 요청을 최대
    # 30초 기다린다(Boot 4.1.0 설정 메타데이터의 기본값 `server.shutdown=graceful` · `spring.lifecycle.timeout-per-shutdown-phase=30s` — 설정 파일에는 명시가 없다.
    # 2026-10-01 로컬 종료 로그에서도 graceful 종료가 켜져 있음을 확인).
    # 10초면 그 사이 SIGKILL 이 와 진행 중이던 요청이 오류로 끊기니, 스프링의 30초보다 5초 길게 둔다(남는 5초는 연결 풀·브로커를 닫는 시간).
    # 스프링 쪽 값을 바꾸면 이 값도 같이 바꾼다 — 절차서 §5.2.
    stop_grace_period: 35s
    # ⚠️ 인스턴스를 늘리면 안 된다(replicas 금지).
    #    (1) @Scheduled 4개(위치 시뮬·연결끊김·근접/미승차·SOS 에스컬레이션)가 중복 실행돼
    #        같은 알림이 여러 번 나간다
    #    (2) 해소됨 — 버스 위치도 RedisBusLocationRepository(@Primary, TTL 15초)로 옮겨
    #        학생 위치(RedisLocationRepository)와 함께 인스턴스 간 공유가 된다.
    #        단 이것만으로는 증설 조건이 성립하지 않는다 — (1)·(3)이 그대로 남아 금지는 유지한다
    #    (3) WebSocket STOMP 세션이 인스턴스에 묶여 있다
    #    상세: docs/archive/specs/2026-08-10-mvp-배포-design.md §4.2
    # env_file 을 쓰지 않는다 — 위 `--env-file` 로 읽은 값을 아래에 **명시적으로** 넘긴다.
    # 파일을 통째로 흘려보내면 컨테이너가 무엇을 받는지 이 파일만 봐서는 알 수 없고,
    # ECR_REGISTRY 같은 배포 전용 변수까지 앱 프로세스 환경에 섞여 들어간다.
    environment:
      # ⚠️ 이 줄이 없으면 application.yml 의 기본값 `local` 로 뜬다 — localhost DB 를 찾고
      #    로컬 데모 시드가 운영 DB 에 실행된다. 반드시 명시한다.
      #    **기본값을 두지 않는다.** 예전에는 `:-demo` 라 SSM 값이 빠진 배포가 가짜 시드 + 가짜 버스
      #    (DemoRunSimulator)로 조용히 떴다. deploy.sh 가 SSM 에서 읽어 `prod` 또는 `demo` 를 .env 에 쓴다.
      #    prod = 실 운영(계정 0개 · 첫 메인 관리자는 아래 BOOTSTRAP_ADMIN_*), demo = prod 에 데모 시드와
      #    Mock 위치 소스를 더한 것(실 기사 단말 GPS 가 없는 데모에서 버스를 움직이려는 용도).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE 미설정 — prod 또는 demo 를 명시한다(deploy.sh 가 SSM 에서 씀)}
      # 컨테이너 내부에서는 서비스 이름으로 접속한다 (localhost 아님)
      DB_URL: jdbc:postgresql://postgres:5432/schoolbus
      DB_USERNAME: schoolbus
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 이 저장소에는 화면이 없으므로 브라우저 클라이언트는 항상 다른 출처에서 온다.
      # 여기 없는 출처에서 온 요청은 브라우저가 차단한다. 목록에 스킴(https://)까지 정확히 적을 것.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS 미설정}
      # WebSocket 핸드셰이크는 CORS 필터를 타지 않고 자체 origin 검사를 한다 — 별도로 줘야 한다.
      WS_ALLOWED_ORIGIN_PATTERNS: ${WS_ALLOWED_ORIGIN_PATTERNS:?WS_ALLOWED_ORIGIN_PATTERNS 미설정}
      # JWT 서명 키. 로컬 기본값이 코드에 박혀 있으므로 운영에서는 반드시 덮어쓴다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 미설정}
      # demo 프로파일의 Flyway placeholder. 미주입 시 기동이 실패하는 게 정상이다 —
      # 조용히 약한 기본값("password")으로 뜨는 것보다 안전하다.
      SEED_PASSWORD_HASH: ${SEED_PASSWORD_HASH:?SEED_PASSWORD_HASH 미설정}
      # 없으면 도로 경로 호출이 실패해 노선이 직선거리 근사(fallback_used=true)로 나오고 미리보기는 503 이 된다.
      # 대체 지도 공급자는 없다 — 공급자는 코드가 app.routing.map.provider(naver 기본 · stub 은 시험용)로 고른다(Ruling 551).
      NAVER_DIRECTIONS_KEY_ID: ${NAVER_DIRECTIONS_KEY_ID:-}
      NAVER_DIRECTIONS_KEY: ${NAVER_DIRECTIONS_KEY:-}
      # prod 프로파일 전용 — FCM 서비스 계정 자격 증명(Ruling 331). demo 는 읽지 않는다(로그 전용 발송).
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      # ── 선택 항목(SSM 에 없으면 yml 기본값으로 뜬다) ──
      # 장소 이름 검색 키(주소 자동완성 보조 후보). 비면 401 로 후보가 줄 뿐 기능은 산다.
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID:-}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET:-}
      # Directions 15 일일 한도(Ruling 361) 전환 — 경로와 최대 지점 수는 **짝**이다(deploy.sh 가 한쪽만 있으면 멈춘다).
      # 값 없는 키(`KEY:`)는 .env 에 있을 때만 컨테이너에 넘어간다 — `${KEY:-}` 로 쓰면 빈 문자열이 넘어가
      # yml 기본값(`/map-direction-15/v1/driving` · 17)을 덮어 경로가 빈 값이 된다.
      NAVER_DIRECTIONS_PATH:
      NAVER_DIRECTIONS_MAX_POINTS:
      # 첫 메인 관리자(system_admin) — 메인 관리자가 하나도 없을 때만 1회 만든다(FirstSystemAdminBootstrap).
      # 비밀번호는 평문이 아니라 bcrypt 해시다(DEPLOYMENT.md §4). 이미 있으면 값은 무시된다.
      BOOTSTRAP_ADMIN_LOGIN_ID: ${BOOTSTRAP_ADMIN_LOGIN_ID:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      # 학생 사진 저장 경로 — 아래 named volume(photo-data)의 마운트 경로와 **같아야** 한다. 고정값이다(SSM 으로 열지
      # 않는다): 어긋나면 사진이 컨테이너 안에만 쌓여 재배포마다 사라지는데 앱은 정상 기동한다.
      PHOTO_STORAGE_ROOT: /app/var/photos
      # 컨테이너에 준 메모리 안에서만 힙을 잡게 한다 — 서버 전체 메모리 기준으로 잡으면 함께 죽는다.
      # ExitOnOutOfMemoryError — OutOfMemoryError 를 던진 스레드만 죽고 JVM 이 살아 있으면 스케줄러·발송 스레드가 하나씩 사라진 반쯤 죽은 서버가 되는데
      # 컨테이너는 계속 "실행 중"이라 재시작 정책이 못 본다. 프로세스를 끝내면 `restart: unless-stopped` 가 되살린다(review-stab S-6).
      # 힙 덤프(HeapDumpOnOutOfMemoryError)는 일부러 켜지 않는다 — 덤프에 학생·보호자 개인정보와 JWT 서명 키·FCM 개인 키가 그대로 담기고,
      # 파일이 힙 크기(약 2.1GB)라 루트 디스크(30GB)를 재시작 반복 때 채운다. 필요하면 스테이징에서 재현해 뜬다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40 -XX:+ExitOnOutOfMemoryError"
    volumes:
      # 학생 사진 — 컨테이너 안(/app/var/photos)에만 두면 배포로 컨테이너가 새로 만들어질 때마다 전부 사라진다.
      # 백업은 infra/scripts/backup-db.sh 가 함께 한다. 저장소를 S3 로 옮기는 것은 오픈 이슈 W.
      - photo-data:/app/var/photos
    expose:
      - "8080"
      # 관리 포트(헬스·지표 · application.yml management.server.port) — 앱 포트가 동시 연결 상한에 닿아도 응답한다(Ruling 740).
      # 호스트에 열지 않고 nginx 도 가지 않는다 — 이 compose 네트워크의 healthcheck·Prometheus 만 닿는다.
      - "8081"
    healthcheck:
      # ⚠️ spring-boot-starter-actuator 를 build.gradle 에 추가해야 동작한다(설계 문서 B5).
      #    추가 전에는 이 healthcheck 가 계속 실패해 proxy 가 기동하지 않는다.
      # 앱 포트(8080)가 아니라 관리 포트를 친다 — 연결 상한에 닿은 backend 를 "응답 없음" 으로 오판해 unhealthy 로 만들지 않는다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *cloudwatch

  # 엣지 프록시 — 인터넷에서 닿는 유일한 지점. TLS 를 여기서 종단한다.
  # `/`(화면) 라우팅이 없다 — 이 서버는 백엔드 API 전용이다.
  proxy:
    image: nginx:1.31.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"    # ACME 챌린지 + HTTPS 리다이렉트 전용
      - "443:443"
    volumes:
      # 전역 설정(연결 한도) — 이미지 기본값 worker_connections 1024 는 동시 세션 목표(2,000)에 못 미친다. 근거는 파일 머리말(BR-328)
      - ./infra/proxy/nginx.main.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/proxy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Swagger UI 보호용 계정 파일. 저장소·S3 를 거치지 않고 **EC2 에서 직접 생성**한다
      # (작업 트리에 만들면 배포용 S3 버킷으로 딸려 올라갈 위험이 있다).
      # 절차: docs/backend/infra/DEPLOYMENT.md §2.12
      - ./infra/proxy/.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 워커 파일 기술자 상한(worker_rlimit_nofile 32768)보다 크게 보장한다 — 호스트 docker 기본값(Amazon Linux 는 32768:65536)에 기대지 않는다
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 인증서가 갱신돼도 nginx 는 알아서 다시 읽지 않는다 — 6시간마다 reload 해 새 인증서를 집어든다.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    logging: *cloudwatch

  # Let's Encrypt 인증서 자동 갱신(90일 만료, 30일 전부터 갱신 시도).
  # 최초 발급은 이 컨테이너가 아니라 infra/certbot/init-cert.sh 로 한 번 수행한다 —
  # 인증서가 없는 상태에서는 nginx 의 443 블록이 기동에 실패해 순환 의존이 생기기 때문이다.
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # 갱신 루프 — 12시간마다 renew 를 돌고 성공했을 때만 성공 시각 지표를 쓴다. 지표 폴더는 backup-db.sh 와 같고 node-exporter 가 같은 폴더를 읽는다(BR-334)
      - ./infra/certbot/renew-loop.sh:/renew-loop.sh:ro
      - /var/lib/node_exporter/textfile:/textfile
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    logging: *cloudwatch

  # ── 관측 스택 (R46 ops C #10) ─────────────────────────────────────────────
  # 설정·규칙·대시보드는 개발용 docker-compose.app.yml 과 같은 infra/observability/ 파일을 쓴다.
  # 운영에서 다른 점: 보존 15일 · 메모리 한도 · 컨테이너 로그도 CloudWatch · 호스트 포트는 loopback 만.
  # Prometheus 는 backend 가 healthy 가 아니어도 떠야 한다 — 그때가 관측이 가장 필요한 때라 depends_on 을 걸지 않는다.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 개발은 7일이고 운영은 15일이다. 디스크는 이 볼륨이 정한다(prometheus-data).
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/observability/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      # 127.0.0.1 — 인터넷에서 안 닿는다. 발화 중인 경보(/alerts)는 수신 채널이 정해지기 전까지 여기서만 보인다.
      - "127.0.0.1:9090:9090"
    logging: *cloudwatch

  # 경보 수신 — 텔레그램 봇 + 이메일 예비(Ruling 480 ④). 설정 파일은 저장소에 없다: deploy.sh 가 SSM 선택 항목으로
  # infra/scripts/render-alertmanager.sh 를 불러 /opt/school-bus/alertmanager/alertmanager.yml 을 만든다(비밀값 포함 · 저장소 밖).
  # 값이 없으면 수신자 없이 뜬다(알림이 어디로도 가지 않는다). 파일 하나가 아니라 폴더를 마운트한다 — 파일 마운트는 파일이
  # 새로 만들어질 때 컨테이너가 옛 파일을 계속 본다. 절차: docs/backend/infra/DEPLOYMENT.md §11.3
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    mem_limit: 96m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    expose:
      - "9093"
    logging: *cloudwatch

  # 호스트의 CPU·메모리·디스크 — 디스크 80% 경보(alerts.yml)와 백업 성공 시각(textfile)의 출처다.
  # ⚠ rslave 전파는 리눅스 호스트(EC2)에서만 된다. macOS Docker Desktop 에서는 기동이 실패한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --path.rootfs=/host
      # 백업 성공 시각(backup-db.sh 가 쓴 *.prom) — 경보 BackupDbStale·BackupPhotosStale 의 출처. 폴더는 bootstrap-ec2.sh 가 만든다.
      - --collector.textfile.directory=/textfile
      # 기본 제외 규칙은 var/lib/docker/.+ 라 데이터 디스크(/var/lib/docker/volumes — DB·사진·지표, bootstrap-ec2.sh)가 시계열에서 빠져
      # 디스크 경보(HostDiskAlmostFull)가 볼 값이 없다. 컨테이너별 마운트(containers·overlay2)만 계속 버린다. `$$` 는 compose 의 `$` 이스케이프.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/(containers|overlay2)/.+|var/lib/containers/storage/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile:/textfile:ro
    expose:
      - "9100"
    logging: *cloudwatch

  # 대시보드 5종은 파일로 프로비저닝한다(UI 수정은 되돌아간다). 외부에 열지 않는다 — 127.0.0.1 에만 바인딩하고
  # SSM 포트 포워딩으로 접근한다(DEPLOYMENT.md §11). 초기 관리자 비밀번호는 SSM(GRAFANA_ADMIN_PASSWORD).
  # 볼륨이 없어 컨테이너를 다시 만들 때마다 SSM 값으로 초기화된다 — 저장할 사용자·설정이 없다.
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 미설정}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    logging: *cloudwatch

volumes:
  postgres-data:
  # 학생 사진 — 재배포(컨테이너 재생성)에도 남는다. 지우면(`down -v`) 사진이 사라진다.
  photo-data:
  prometheus-data:
  certbot-conf:
  certbot-www:
