# 운영(데모) 배포용 compose — EC2 1대에 백엔드 + 인프라 전부를 올린다.
#
# 실행:
#   docker compose -f docker-compose.prod.yml --env-file /opt/school-bus/.env up -d
#
# 로컬용 docker-compose.yml 과 의도적으로 분리했다. 로컬 파일은 "매번 시드 상태로 리셋"이
# 목적이라 볼륨이 없고 DB·Redis·Kafka 포트를 호스트에 열어두는데, 둘 다 운영에서는 정반대다.
#
# ── 로컬 파일과 달라지는 지점 ──
#   1. postgres·kafka 에 named volume 을 붙인다 (재시작해도 데이터 유지)
#   2. DB·Redis·Kafka 포트를 호스트에 열지 않는다 (컨테이너 네트워크 안에서만 접근)
#   3. backend 를 빌드하지 않고 ECR 이미지를 pull 한다 (EC2 에서 Gradle 빌드는 메모리 부족)
#   4. frontend 서비스가 없다 — 웹은 Vercel 이 서빙한다
#   5. proxy 가 443(TLS)을 종단하고, certbot 이 인증서를 자동 갱신한다
#
# ⚠️ 필요한 환경변수는 infra/scripts/deploy.sh 가 SSM Parameter Store 에서 읽어
#    /opt/school-bus/.env 로 생성한다. 이 파일에는 비밀값을 절대 적지 않는다.

# 모든 컨테이너 로그를 CloudWatch 로 보낸다 — EC2 가 죽어도 로그는 남는다.
# CloudWatch 를 안 쓰려면 이 앵커를 지우고 각 서비스의 `logging: *cloudwatch` 줄을 빼면 된다.
x-logging: &cloudwatch
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-northeast-2}
    awslogs-group: /school-bus/demo
    awslogs-create-group: "true"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolbus
      POSTGRES_USER: schoolbus
      # 비밀번호는 .env 를 통해서만 들어온다. 기본값을 두지 않아 미주입 시 기동이 실패하게 한다 —
      # 조용히 약한 기본값으로 뜨는 것보다 못 뜨는 편이 안전하다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 미설정}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 호스트에 포트를 열지 않는다. DB 접속이 필요하면 SSM Session Manager 로 EC2 에 들어가
    # `docker compose -f docker-compose.prod.yml exec postgres psql -U schoolbus` 를 쓴다.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *cloudwatch

  redis:
    image: redis:7
    restart: unless-stopped
    # 위치 캐시(TTL 9초) 전용이라 영속화가 불필요하다 — 유실돼도 다음 tick 에 복구된다.
    # 대신 메모리 상한을 걸어 Kafka·Spring 의 몫을 침범하지 않게 한다.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *cloudwatch

  # KRaft 모드 단일 브로커. MSK 를 쓰지 않는 이유는 설계 문서 §2.3 참조(월 $110~547 vs $0).
  #
  # ⚠️ 로컬 파일에 있던 PLAINTEXT_HOST(29092) 리스너를 뺐다. 그건 "호스트에서 bootRun 으로
  #    직접 붙기" 위한 개발용 통로인데, 운영에서는 백엔드도 컨테이너라 필요가 없고 열어두면
  #    공격 표면만 늘어난다.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 기본 로그 디렉터리가 /tmp 라 볼륨을 붙여도 소용이 없다 — 명시적으로 옮긴다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # t3.medium(4GB)에 Spring·Postgres 와 함께 올라가므로 기본 힙(1GB)을 절반으로 낮춘다.
      # 이 줄이 없으면 OOM Killer 가 Kafka 나 Spring 중 하나를 죽인다(설계 문서 §2.8).
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      # 데모 트래픽에 7일치 로그는 과하다. 디스크(30GB)를 아낀다.
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes:
      - kafka-data:/var/lib/kafka/data
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging: *cloudwatch

  backend:
    # EC2 에서 빌드하지 않는다 — Gradle(Java 25) 빌드가 2GB 안팎을 먹어 실행 중인
    # 컨테이너들과 경합하면 OOM 이 난다. GitHub Actions 가 빌드해 ECR 에 올린 걸 받아 쓴다.
    image: ${ECR_REGISTRY:?ECR_REGISTRY 미설정}/school-bus-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # ⚠️ 인스턴스를 늘리면 안 된다(replicas 금지).
    #    (1) @Scheduled 4개(위치 시뮬·연결끊김·근접/미승차·SOS 에스컬레이션)가 중복 실행돼
    #        같은 알림이 여러 번 나간다
    #    (2) 버스 위치가 InMemoryBusLocationRepository 라 인스턴스 간 공유가 안 된다
    #        (학생 위치는 RedisLocationRepository 로 이미 해결됨)
    #    (3) WebSocket STOMP 세션이 인스턴스에 묶여 있다
    #    상세: docs/superpowers/specs/2026-08-10-mvp-배포-design.md §4.2
    # env_file 을 쓰지 않는다 — 위 `--env-file` 로 읽은 값을 아래에 **명시적으로** 넘긴다.
    # 파일을 통째로 흘려보내면 컨테이너가 무엇을 받는지 이 파일만 봐서는 알 수 없고,
    # ECR_REGISTRY 같은 배포 전용 변수까지 앱 프로세스 환경에 섞여 들어간다.
    environment:
      # ⚠️ 이 줄이 없으면 application.yml 의 기본값 `local` 로 뜬다 — localhost DB 를 찾고
      #    로컬 데모 시드가 운영 DB 에 실행된다. 반드시 명시한다.
      #    demo 프로파일은 prod 를 기반으로 (a) 데모 시드 로드, (b) Mock 위치 소스 활성을 더한 것이다.
      #    실 기사 단말 GPS 가 없는 데모에서 prod 를 그대로 쓰면 버스가 움직이지 않는다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      # 컨테이너 내부에서는 서비스 이름으로 접속한다 (localhost 아님)
      DB_URL: jdbc:postgresql://postgres:5432/schoolbus
      DB_USERNAME: schoolbus
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 웹이 Vercel(app.<도메인>)로 분리돼 API 와 출처가 달라졌다 — 로컬의 same-origin 이점이 사라진다.
      # 여기 없는 출처에서 온 요청은 브라우저가 차단한다. 목록에 스킴(https://)까지 정확히 적을 것.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS 미설정}
      # JWT 서명 키. 로컬 기본값이 코드에 박혀 있으므로 운영에서는 반드시 덮어쓴다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 미설정}
      # demo 프로파일의 Flyway placeholder. 미주입 시 기동이 실패하는 게 정상이다 —
      # 조용히 약한 기본값("password")으로 뜨는 것보다 안전하다.
      SEED_PASSWORD_HASH: ${SEED_PASSWORD_HASH:?SEED_PASSWORD_HASH 미설정}
      # 없으면 배차·시뮬레이션·노선 생성이 전부 500 이 된다. 키를 못 구하면 ROUTING_PROVIDER=osrm 로 우회.
      NAVER_DIRECTIONS_KEY_ID: ${NAVER_DIRECTIONS_KEY_ID:-}
      NAVER_DIRECTIONS_KEY: ${NAVER_DIRECTIONS_KEY:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-naver}
      # 컨테이너에 준 메모리 안에서만 힙을 잡게 한다 — 서버 전체 메모리 기준으로 잡으면 함께 죽는다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40"
    expose:
      - "8080"
    healthcheck:
      # ⚠️ spring-boot-starter-actuator 를 build.gradle 에 추가해야 동작한다(설계 문서 B5).
      #    추가 전에는 이 healthcheck 가 계속 실패해 proxy 가 기동하지 않는다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *cloudwatch

  # 엣지 프록시 — 인터넷에서 닿는 유일한 지점. TLS 를 여기서 종단한다.
  # 로컬과 달리 `/`(프론트) 라우팅이 없다. 웹은 Vercel 이 서빙하므로 이 서버는 API 전용이다.
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"    # ACME 챌린지 + HTTPS 리다이렉트 전용
      - "443:443"
    volumes:
      - ./infra/proxy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Swagger UI 보호용 계정 파일. 생성:
      #   docker run --rm httpd:alpine htpasswd -nbB <아이디> '<비밀번호>' > infra/proxy/.htpasswd
      - ./infra/proxy/.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 인증서가 갱신돼도 nginx 는 알아서 다시 읽지 않는다 — 6시간마다 reload 해 새 인증서를 집어든다.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    logging: *cloudwatch

  # Let's Encrypt 인증서 자동 갱신(90일 만료, 30일 전부터 갱신 시도).
  # 최초 발급은 이 컨테이너가 아니라 infra/certbot/init-cert.sh 로 한 번 수행한다 —
  # 인증서가 없는 상태에서는 nginx 의 443 블록이 기동에 실패해 순환 의존이 생기기 때문이다.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    logging: *cloudwatch

volumes:
  postgres-data:
  kafka-data:
  certbot-conf:
  certbot-www:
